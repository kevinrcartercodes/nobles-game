// ============================================================================
// NEW GAME
// ============================================================================

function newGame(playerConfigs, difficulty = 'medium') {
  const n = playerConfigs.length;
  const { hexes, hexMap, tractCenters } = generateMap(n);

  const houses = [...HOUSES];
  shuffle(houses);

  const players = playerConfigs.map((cfg, i) => ({
    id: i,
    name: cfg.name || COLOR_NAMES[i],
    color: COLORS[i],
    ai: cfg.ai,
    // Which browser controls this seat. null = offline/AI (anyone at the
    // keyboard). Online human seat = that joiner's CLIENT_ID. isMyTurn()
    // compares this to our own CLIENT_ID to gate inputs.
    clientId: cfg.clientId || null,
    house: houses[i],
    homeTract: i + 1,        // province this house must place its castle in (tract 0 = the odd neutral hex)
    gold: STARTING_GOLD,
    eliminated: false,
    castleLost: false,
    capturedHolding: false,
    unitBuildsThisRound: [], // hex keys where this player has recruited this round (max 1/holding)
    rightOfPassage: new Set(), // player IDs granting passage this round
  }));

  // Build event deck
  const deck = EVENTS.filter(e => !e.retired);
  shuffle(deck);

  // Difficulty-based starting gold for AI. Brutal gets the same +10g as Hard —
  // its edge is strategy, not resources, but without the bonus it would feel
  // EASIER than Hard in practice (Hard's +10g matters more than its aggression).
  const aiGoldBonus = (difficulty === 'hard' || difficulty === 'brutal') ? 10 : difficulty === 'easy' ? -5 : 0;
  players.forEach(p => { if (p.ai) p.gold = Math.max(5, p.gold + aiGoldBonus); });

  // Roll for first player. Seat order stays fixed (P0 keeps their color),
  // but WHO acts first each round is random. Castle placement runs in
  // reverse turn order — last-to-act places first (terrain compensation),
  // so the seat that drew the initiative places their castle LAST.
  const firstPlayer = Math.floor(rand() * players.length);
  const lastInTurnOrder = (firstPlayer + players.length - 1) % players.length;

  G = {
    players, hexes, hexMap, tractCenters,
    round: 1,
    phase: 'setup-castle',
    turn: lastInTurnOrder,
    firstPlayer,
    // Seat that won the initiative roll — preserved across rounds even if
    // they get eliminated (doEnd walks forward from here to find the next
    // alive seat rather than resetting to 0).
    firstPlayerSeat: firstPlayer,
    castlesPlaced: 0,
    selected: null,
    mode: null,
    currentEvent: null,
    eventFlags: {},
    eventDeck: deck,
    eventDiscard: [],
    eventAge: 0,        // rounds the current event has been active (for multi-round events)
    logEntries: [],
    componentsUsed: { outpost: 0, village: 0 },
    difficulty,
    victory: null,      // set once, by endGame()
    tutorialShown: new Set(),
    tutorialSkipped: false,
  };

  log(G, `=== NEW GAME — ${n} players — ${difficulty.toUpperCase()} ===`, 'turn');
  log(G, `Houses: ${players.map(p => `${p.name}→${p.house.name}`).join(', ')}`);
  const turnOrder = [];
  for (let i = 0; i < n; i++) turnOrder.push(players[(firstPlayer + i) % n].name);
  log(G, `Initiative: ${players[firstPlayer].name} goes first. Turn order: ${turnOrder.join(' → ')}`, 'turn');

  G._effects = [];
  return G;
}

// ============================================================================
// RULES ENGINE
// ============================================================================

function getHex(q, r) { return G.hexMap[hexKey(q, r)]; }
// Lake passability is dynamic: frozen solid during Winter. A unit left on ice
// when the thaw comes can still move OFF (getValidMoves starts from the unit's
// hex without checking its own passability) but can't cross further lake tiles.
// Supply traces the same way — a stranded unit with no adjacent owned fief
// will drown. Lake fiefs claimed on ice stay owned after thaw but become
// impassable again, which can sever a supply line. All intentional: thin ice
// is a risk-reward shortcut, not a free road.
function lakeFrozen() { return G && G.eventFlags && G.eventFlags.winter; }
function isPassable(h) {
  if (!h) return false;
  if (h.terrain === 'mountain') return false;
  if (h.terrain === 'lake') return lakeFrozen();
  return true;
}
function isImpassable(h) { return !isPassable(h); }

function currentPop(hex) {
  if (!hex.holding) return 0;
  return HOLDING_TYPES[hex.holding.type].pop - hex.holding.damage;
}
function totalPop(g, p) {
  let pop = 0;
  g.hexes.forEach(h => { if (h.holding && h.holding.owner === p.id) pop += g.eventFlags.uprising && h.holding.type === 'outpost' ? 0 : currentPop(h); });
  return pop;
}
function countFiefs(g, pid) { return g.hexes.filter(h => h.fief === pid).length; }
function countUnits(g, pid) { return g.hexes.filter(h => h.unit && h.unit.owner === pid).length; }
function calcFees(g, p) { return countFiefs(g, p.id) + totalPop(g, p); }
// Walls of the player's castle — the Conquest clock. No castle = 0.
function castleHealth(g, p) {
  const c = g.hexes.find(h => h.holding && h.holding.type === 'castle' && h.holding.owner === p.id);
  return { hp: c ? currentPop(c) : 0, max: HOLDING_TYPES.castle.pop };
}

function unitCost(g, type) {
  let c = UNIT_TYPES[type].cost;
  if (g.eventFlags.marketDay) c = Math.max(5, c - 5);
  return c;
}
function holdingCost(g, p, type) {
  let c = HOLDING_TYPES[type].cost;
  if (type === 'village' && p.house.key === 'architect') c = 15;
  if (type === 'outpost' && p.house.key === 'castellan') c = 15;
  if (g.eventFlags.buildingBoom) c = Math.max(10, c - 10);
  if (g.eventFlags.royalFavor && g.eventFlags.royalFavorTarget === p.id && !p._usedRoyalFavor) {
    c = Math.max(0, c - 15);
  }
  return c;
}

// --- Movement validation ---

// Effective move allowance this round — base type range, capped by Mud,
// extended by Forced March. This is the budget movesUsed spends from.
function moveRange(unit) {
  let r = UNIT_TYPES[unit.type].move;
  if (G.eventFlags.mud) r = 1;
  if (G.eventFlags.forcedMarch) r += 1;
  return r;
}

function getValidMoves(hex) {
  if (!hex.unit || hex.unit.moved) return [];
  // Knights (and Forced-March units) can split their move: take a 1-tile
  // step, look around, take another. The BFS runs from the CURRENT position
  // with whatever budget remains — so after a 1-step, range collapses to 1
  // and the knight sees only adjacent tiles for the second click.
  const range = moveRange(hex.unit) - (hex.unit.movesUsed || 0);
  if (range <= 0) return [];

  const results = [];
  const visited = new Set([hexKey(hex.q, hex.r)]);
  // Track path: each frontier node remembers hexes it passed through (excluding start)
  let frontier = [{ h: hex, steps: 0, path: [] }];

  while (frontier.length) {
    const next = [];
    for (const node of frontier) {
      if (node.steps >= range) continue;
      for (const [nq, nr] of neighbors(node.h.q, node.h.r)) {
        const nh = getHex(nq, nr);
        if (!nh) continue;
        const key = hexKey(nq, nr);
        if (visited.has(key)) continue;
        if (isImpassable(nh)) continue;
        // friendly unit blocks
        if (nh.unit && nh.unit.owner === hex.unit.owner) continue;

        // Forced March is "+1 movement for all", but a forest zeroes the rest of the
        // budget — so under that card a knight that stepped into trees got nothing from
        // it at all. Under Forced March a forest costs a step like open ground. Rivers
        // still end a move: you ford and re-form on the far bank.
        const forestStops = !G.eventFlags.forcedMarch;
        const endsMove = (forestStops && nh.terrain === 'forest') || hasRiverBetween(node.h, nh) || (nh.unit && nh.unit.owner !== hex.unit.owner) || (nh.holding && nh.holding.owner !== hex.unit.owner);

        visited.add(key);
        // path = tiles passed through to get here (Knight conquers these)
        const path = [...node.path];
        if (node.h !== hex) path.push(node.h);
        results.push({
          hex: nh,
          path,
          endsMove,        // executeMove needs this — forest/river/combat exhaust the budget
          combat: nh.unit && nh.unit.owner !== hex.unit.owner,
          siege: nh.holding && nh.holding.owner !== hex.unit.owner && !nh.unit
        });
        if (!endsMove) next.push({ h: nh, steps: node.steps + 1, path: [...path] });
      }
    }
    frontier = next;
  }
  return results;
}

function hasRiverBetween(a, b) {
  if (G.eventFlags.winter) return false;
  // Check if edge between a and b is a river (from either side)
  const dirIdx = DIRS.findIndex(([dq, dr]) => a.q + dq === b.q && a.r + dr === b.r);
  if (dirIdx === -1) return false;
  if (a.rivers && a.rivers.includes(dirIdx)) return true;
  const opp = (dirIdx + 3) % 6;
  if (b.rivers && b.rivers.includes(opp)) return true;
  return false;
}

// --- Combat ---

function resolveCombatCore(attackerHex, defenderHex, isRanged = false) {
  const atk = attackerHex.unit, def = defenderHex.unit;
  if (G.eventFlags.peace) { log(G, 'Peace Treaty: combat prevented'); return 'blocked'; }
  const beats = UNIT_TYPES[atk.type].beats === def.type;
  const loses = UNIT_TYPES[def.type].beats === atk.type;
  const tie = !beats && !loses;

  if (isRanged) {
    if (beats) {
      log(G, `${pname(atk.owner)}'s Bowman shoots ${pname(def.owner)}'s ${def.type}`, 'combat');
      defenderHex.unit = null;
      return 'atk';
    } else if (tie) {
      // Bowman vs Bowman — both die, regardless of range
      log(G, `${pname(atk.owner)}'s and ${pname(def.owner)}'s Bowmen trade shots — both fall`, 'combat');
      attackerHex.unit = null;
      defenderHex.unit = null;
      return 'both';
    } else {
      log(G, `${pname(atk.owner)}'s arrow glances off the ${def.type}`, 'combat');
      return 'miss';
    }
  }

  if (tie) {
    if (defenderHex.terrain === 'forest') {
      log(G, `${pname(def.owner)}'s ${def.type} holds the forest vs ${pname(atk.owner)}'s ${atk.type}`, 'combat');
      attackerHex.unit = null;
      return 'def';
    }
    log(G, `${pname(atk.owner)}'s ${atk.type} and ${pname(def.owner)}'s ${def.type} destroy each other`, 'combat');
    attackerHex.unit = null;
    defenderHex.unit = null;
    return 'both';
  } else if (beats) {
    log(G, `${pname(atk.owner)}'s ${atk.type} kills ${pname(def.owner)}'s ${def.type}`, 'combat');
    defenderHex.unit = null;
    return 'atk';
  } else {
    log(G, `${pname(def.owner)}'s ${def.type} kills ${pname(atk.owner)}'s ${atk.type}`, 'combat');
    attackerHex.unit = null;
    return 'def';
  }
}

// pid -1 = neutral (eliminated player's leftover units). Every combat log
// line calls pname on both sides — unguarded G.players[-1].name was the
// crash behind "cannot attack the colorless knight".
function pname(pid) { return pid < 0 ? 'a masterless' : G.players[pid].name; }

// --- Execute move ---

function executeMoveCore(from, to, path = [], endsMove = true) {
  const unit = from.unit;
  const p = G.players[unit.owner];

  // Split-move bookkeeping. A knight moving 1 tile onto open grass spends 1
  // of its 2 points and can step again this turn. Forest/river/combat/siege
  // exhaust the rest (endsMove=true from getValidMoves). Combat/siege paths
  // below all set moved=true directly, so this only matters for the clean
  // "Normal move" branch at the bottom.
  const stepCost = path.length + 1;
  const spend = () => {
    unit.movesUsed = (unit.movesUsed || 0) + stepCost;
    unit.moved = endsMove || unit.movesUsed >= moveRange(unit);
  };

  // Conquer tiles passed through (Knight's 2-move claims both hexes)
  const conquerPath = () => {
    for (const via of path) {
      // Don't flip fiefs under enemy holdings we passed — those need siege
      if (!via.holding || via.holding.owner === unit.owner) {
        conquer(via, p);
      }
    }
  };

  const enemyHolding = to.holding && to.holding.owner !== unit.owner;
  const enemyUnit = to.unit && to.unit.owner !== unit.owner;

  // Defended enemy holding: fight the garrison, begin siege if you win.
  // MUST come before the generic combat case — that case was eating this one
  // and incorrectly calling conquer() on the holding's fief.
  if (enemyHolding && enemyUnit) {
    const result = resolveCombat(from, to);
    unit.attacked = true; // combat-move consumes ranged attack
    if (result === 'atk') {
      to.unit = unit;
      from.unit = null;
      unit.moved = true;
      conquerPath();
      if (currentPop(to) === 0) { checkCapture(to); return; }   // walls already down — it's yours now
      log(G, `${p.name}'s ${unit.type} breaks the garrison and begins siege (pop ${currentPop(to)})`, 'combat');
    } else {
      unit.moved = (result !== 'blocked');
    }
    return;
  }

  // Undefended enemy holding: begin siege (damage ticks at end of round)
  if (enemyHolding && !to.unit) {
    if (G.eventFlags.peace) { log(G, 'Peace Treaty: cannot siege'); return; }
    to.unit = unit;
    from.unit = null;
    unit.moved = true;
    unit.attacked = true;
    conquerPath();
    if (currentPop(to) === 0) { checkCapture(to); return; }   // walls already down — capture is immediate, as the rules say
    log(G, `${p.name}'s ${unit.type} begins siege of ${pname(to.holding.owner)}'s ${to.holding.type} (pop ${currentPop(to)})`, 'combat');
    return;
  }

  // Enemy unit on non-holding tile: open-field combat, conquer the tile if you win
  if (enemyUnit) {
    const result = resolveCombat(from, to);
    unit.attacked = true; // combat-move consumes ranged attack — only empty-tile moves preserve it
    if (result === 'atk') {
      to.unit = unit;
      from.unit = null;
      unit.moved = true;
      conquerPath();
      conquer(to, p);
    } else {
      unit.moved = (result !== 'blocked');
    }
    return;
  }

  // Normal move (empty tile, no enemy holding) — bowman keeps its ranged attack.
  // This is the ONLY branch where a knight might have budget left: every path
  // above is combat/siege, which getValidMoves already flags as endsMove=true.
  to.unit = unit;
  from.unit = null;
  spend();
  conquerPath();
  conquer(to, p);
}

function conquer(hex, p) {
  // Ice is a road, not land. You can walk across a frozen lake during Winter
  // but you don't OWN the water — it thaws next round and you'd just lose the
  // fief anyway. No tax, no Surveyor gold, no supply anchor. (Supply still
  // TRACES through ice — see supplyTrace — so crossing doesn't strand you.)
  if (hex.terrain === 'lake') return;

  const wasUnclaimed = hex.fief === null;
  if (hex.fief !== p.id) {
    hex.fief = p.id;
    effect(G, { type: 'conquer', hex: { q: hex.q, r: hex.r }, player: p.id, wasUnclaimed });
    if (wasUnclaimed && p.house.key === 'surveyor') {
      p.gold += 1;
      log(G, `Surveyor: ${p.name} +1g for unclaimed tile`);
    }
  }
}

function checkCapture(hex) {
  if (!hex.holding) return;
  if (currentPop(hex) > 0) return;
  const oldOwner = hex.holding.owner;
  const newOwner = hex.unit ? hex.unit.owner : null;
  if (newOwner === null) return; // nobody standing on it — wait for a claimant

  // Neutral squatter (owner -1, debris from a prior elimination). Can't
  // capture, but also can't stay: a neutral can never move, so returning
  // here would deadlock the building at 0 forever. The collapse takes them.
  // Next real unit to walk on claims the ruins. (pname(-1) would also crash.)
  if (newOwner < 0) {
    log(G, `${pname(oldOwner)}'s ${hex.holding.type} falls — the masterless garrison is buried in the rubble`, 'combat');
    hex.unit = null;
    return;
  }
  if (newOwner === oldOwner) return; // your own unit on your own emptied walls is a garrison, not a capture

  log(G, `${pname(newOwner)} CAPTURES ${pname(oldOwner)}'s ${hex.holding.type}!`, 'turn');
  effect(G, { type: 'capture', hex: { q: hex.q, r: hex.r }, what: hex.holding.type, from: oldOwner, to: newOwner });
  hex.holding.owner = newOwner;
  hex.fief = newOwner;
  G.players[newOwner].capturedHolding = true;

  // CONQUEST. Taking an enemy castle ends the game on the spot. During the
  // end-of-round siege tick doEnd picks this up; mid-turn (a bowman volley
  // dropping the walls with your knight already inside) it fires right here.
  if (hex.holding.type === 'castle' && oldOwner >= 0 && oldOwner !== newOwner) {
    const v = { winner: G.players[newOwner], cond: 'Conquest', val: `${pname(oldOwner)}'s castle` };
    if (G.phase === 'act') endGame(G, v); else G.victory = G.victory || v;
    return;
  }

  if (hex.holding.type === 'castle') {
    // Old owner loses their castle — they keep playing but can't collect income
    const oldPlayer = G.players[oldOwner];
    if (!oldPlayer.castleLost) {
      oldPlayer.castleLost = true;
      log(G, `${oldPlayer.name} has LOST THEIR CASTLE — no income until recaptured!`, 'turn');
    }
    // New owner regains castle status if they had lost theirs
    const newPlayer = G.players[newOwner];
    if (newPlayer.castleLost) {
      newPlayer.castleLost = false;
      log(G, `${newPlayer.name} has RECLAIMED A CASTLE — income restored!`, 'turn');
    }
  }
}

// The one way a game ends. Idempotent — siege ticks and bowman volleys can
// both reach a capture, and both funnel here.
function endGame(g, v) {
  if (g.phase === 'over') return;
  g.victory = v;
  g.phase = 'over';
  log(g, `👑 ${v.winner.name} WINS by ${v.cond} (${v.val})`, 'turn');
  effect(g, { type: 'victory', winner: v.winner.id, cond: v.cond, val: v.val });
}

function eliminatePlayer(p) {
  p.eliminated = true;
  log(G, `${p.name} is ELIMINATED`, 'turn');
  // units become neutral (owner = -1), other holdings removed, fiefs become null (unclaimed)
  G.hexes.forEach(h => {
    if (h.unit && h.unit.owner === p.id) h.unit.owner = -1; // neutral
    if (h.holding && h.holding.owner === p.id && h.holding.type !== 'castle') {
      G.componentsUsed[h.holding.type]--;
      h.holding = null;
    }
    if (h.fief === p.id) h.fief = null;
  });
}

// --- Bowman ranged ---

function getBowmanTargets(hex) {
  if (!hex.unit || hex.unit.type !== 'bowman' || hex.unit.attacked) return [];
  if (G.eventFlags.fog) return [];
  const range = G.eventFlags.clearSkies ? 2 : 1;
  const targets = [];
  const addTargetsAt = (nh) => {
    if (!nh) return;
    // Neutrals are valid targets — they're leftovers from an eliminated
    // house, just sitting there. No reason you can't shoot them.
    const enemyUnit = nh.unit && nh.unit.owner !== hex.unit.owner;
    const enemyHolding = nh.holding && nh.holding.owner !== hex.unit.owner;
    // Enemy holding is always a valid building target — regardless of who (if anyone) is on it.
    // This lets a bowman choose: shoot the besieger/garrison, or bombard the walls.
    if (enemyUnit) targets.push({ hex: nh, type: 'unit' });
    if (enemyHolding) targets.push({ hex: nh, type: 'holding' });
  };
  // range 1: adjacent
  for (const [nq, nr] of neighbors(hex.q, hex.r)) {
    addTargetsAt(getHex(nq, nr));
  }
  if (range === 2) {
    // straight line through non-blocking
    for (const [dq, dr] of DIRS) {
      const m1 = getHex(hex.q + dq, hex.r + dr);
      if (isImpassable(m1)) continue;
      addTargetsAt(getHex(hex.q + dq*2, hex.r + dr*2));
    }
  }
  return targets;
}

function executeBowmanAttackCore(from, target, targetType) {
  const unit = from.unit;
  unit.attacked = true;   // blocks further ranged attacks (same-turn gate)
  unit.rangedUsed = true; // blocks passive siege contribution (shot is spent)
  if (G.eventFlags.peace) { log(G, 'Peace Treaty: ranged attack blocked'); return; }
  if (targetType === 'unit') {
    resolveCombat(from, target, true);
  } else if (targetType === 'holding') {
    target.holding.damage = Math.min(target.holding.damage + 1, HOLDING_TYPES[target.holding.type].pop);
    log(G, `${pname(unit.owner)}'s Bowman fires on ${pname(target.holding.owner)}'s ${target.holding.type} (pop ${currentPop(target)})`, 'combat');
    // Bowman doesn't occupy, so capture-at-0 needs an adjacent melee — for now leave at 0, capture when melee arrives
    if (currentPop(target) === 0 && target.unit && target.unit.owner === unit.owner) {
      checkCapture(target);
    } else if (currentPop(target) === 0) {
      log(G, `${target.holding.type} at 0 — send a unit to capture`);
    }
  }
}

// --- Supply lines ---

function supplyTrace(g, unitHex, player, opts = {}) {
  // BFS to find shortest valid supply path to a friendly holding.
  // opts.anchorTypes: which holding types count as endpoints (default: all)
  // opts.returnPath: also return the path tiles
  const isQM = player.house.key === 'quartermaster';
  const passage = player.rightOfPassage;
  const anchorTypes = opts.anchorTypes || null; // null = any type

  // A holding anchors supply as long as it still belongs to the player —
  // a siege in progress does NOT cut supply. Only actual capture does.
  const isAnchor = (h) =>
    h.holding &&
    h.holding.owner === player.id &&
    (!anchorTypes || anchorTypes.includes(h.holding.type));

  const visited = new Set([hexKey(unitHex.q, unitHex.r)]);
  const cameFrom = {};
  let frontier = [unitHex];
  let dist = 0;

  if (isAnchor(unitHex)) {
    return opts.returnPath ? { cost: 0, path: [unitHex] } : 0;
  }

  while (frontier.length && dist < 50) {
    dist++;
    const next = [];
    for (const h of frontier) {
      for (const [nq, nr] of neighbors(h.q, h.r)) {
        const nh = getHex(nq, nr);
        if (!nh) continue;
        const key = hexKey(nq, nr);
        if (visited.has(key)) continue;
        if (isImpassable(nh)) continue;

        cameFrom[key] = h;

        // Check for anchor FIRST — a besieged holding still anchors supply
        // even though an enemy stands on it (tile wouldn't pass canTrace below).
        if (isAnchor(nh)) {
          if (opts.returnPath) {
            const path = [nh];
            let cur = h;
            while (cur && cur !== unitHex) {
              path.push(cur);
              cur = cameFrom[hexKey(cur.q, cur.r)];
            }
            path.push(unitHex);
            return { cost: dist, path };
          }
          return dist;
        }

        // Supply path traces ONLY through fiefs you own.
        // Unclaimed tiles block supply just like enemy fiefs.
        // An enemy unit standing on your fief cuts that tile.
        // Quartermaster / right-of-passage still allow tracing enemy fiefs.
        // Frozen lakes are nobody's fief (conquer() refuses them) but supply
        // traces through anyway — sleds on ice. Otherwise walking to the far
        // shore during Winter would instantly cut you off, making the whole
        // freeze mechanic a trap instead of a shortcut.
        const ownFief = nh.fief === player.id;
        const enemyFief = nh.fief !== null && nh.fief !== player.id;
        const enemyOnOwnFief = ownFief && nh.unit && nh.unit.owner !== player.id && nh.unit.owner !== -1;
        const frozenLake = nh.terrain === 'lake' && lakeFrozen();

        let canTrace = false;
        if (ownFief && !enemyOnOwnFief) canTrace = true;
        else if (enemyFief && (isQM || passage.has(nh.fief))) canTrace = true;
        else if (frozenLake) canTrace = true;
        if (!canTrace) continue;

        visited.add(key);
        next.push(nh);
      }
    }
    frontier = next;
  }
  return opts.returnPath ? { cost: Infinity, path: [] } : Infinity;
}

// Supply COST: distance to nearest holding of ANY type (outposts count here)
function supplyCost(g, unitHex, player, returnPath = false) {
  return supplyTrace(g, unitHex, player, { returnPath });
}

// Survival check: needs path to Castle OR Village. Outpost alone = dead.
function hasSupplyAnchor(g, unitHex, player) {
  return supplyTrace(g, unitHex, player, { anchorTypes: ['castle', 'village'] }) !== Infinity;
}

function isBesieged(g, hex) {
  // A holding is besieged if an enemy unit is on it (melee siege)
  if (!hex.holding) return false;
  if (hex.unit && hex.unit.owner !== hex.holding.owner && hex.unit.owner !== -1) return true;
  return false;
}

function checkSupplyCutoff(g) {
  // Immediate death for any unit with no supply path to a Castle or Village.
  // Outposts reduce supply COST but do NOT prevent cutoff death.
  // Called after each player's Act.
  let humanUnitDied = false;
  g.hexes.forEach(h => {
    if (!h.unit || h.unit.owner < 0) return; // skip neutrals
    const p = g.players[h.unit.owner];
    if (p.eliminated) return;
    if (!hasSupplyAnchor(g, h, p)) {
      // Tell the player what it COULD reach (usually an outpost, or nothing at all)
      const costToAny = supplyCost(g, h, p);
      const detail = costToAny === Infinity
        ? ' (no friendly holding reachable)'
        : ` (only reaches an outpost — needs castle/village)`;
      log(g, `💀 ${p.name}'s ${h.unit.type} at (${h.q},${h.r}) CUT OFF${detail} — dies`, 'combat');
      effect(g, { type: 'desert', hex: { q: h.q, r: h.r }, unit: { type: h.unit.type, owner: h.unit.owner }, reason: 'cutoff' });
      if (!p.ai) humanUnitDied = true;
      h.unit = null;
    }
  });
  if (humanUnitDied) g._pauseAI = true; // let the human see what happened
}

// --- Building validation ---

function canBuildHolding(g, hex, player, type) {
  const cost = holdingCost(g, player, type);
  if (player.gold < cost) return { ok: false, why: `Need ${cost}g` };
  if (g.componentsUsed[type] >= COMPONENT_LIMITS[type]) return { ok: false, why: `No ${type}s left` };

  if (type === 'village') {
    // Villages can ONLY be built as an upgrade from an outpost
    if (!hex.holding || hex.holding.type !== 'outpost' || hex.holding.owner !== player.id) {
      return { ok: false, why: 'Select your outpost to upgrade' };
    }
    if (isBesieged(g, hex)) return { ok: false, why: 'Outpost is under siege' };
    return { ok: true, cost, upgrade: true };
  }

  // Outpost: standard build rules
  if (hex.fief !== player.id) return { ok: false, why: 'Not your fief' };
  if (hex.holding) return { ok: false, why: 'Already a holding here' };
  if (!hex.unit || hex.unit.owner !== player.id) return { ok: false, why: 'Need your unit on this fief' };
  // spacing: no holding within 1 tile
  for (const [nq, nr] of neighbors(hex.q, hex.r)) {
    const nh = getHex(nq, nr);
    if (nh && nh.holding) return { ok: false, why: 'Too close to another holding' };
  }
  return { ok: true, cost };
}

function getUnitSpawns(g, player) {
  // All holdings where a unit could appear: castle, village, or outpost.
  // Not blocked by own unit. Besieged holdings ARE valid (sally-out combat).
  // Excludes holdings that have already recruited this round — one build per holding.
  const used = new Set(player.unitBuildsThisRound || []);
  return g.hexes.filter(h =>
    h.holding &&
    h.holding.owner === player.id &&
    !(h.unit && h.unit.owner === player.id) &&
    !used.has(hexKey(h.q, h.r))
  );
}

function canBuildUnit(g, player, type) {
  const cost = unitCost(g, type);
  if (player.gold < cost) return { ok: false, why: `Need ${cost}g` };
  const spawns = getUnitSpawns(g, player);
  if (!spawns.length) {
    // Say WHY. "No holding left" read as a bug when the real reason was the
    // player's own spearman standing on the castle.
    const mine = g.hexes.filter(h => h.holding && h.holding.owner === player.id);
    const blocked = mine.filter(h => h.unit && h.unit.owner === player.id).length;
    const why = !mine.length ? 'You have no holdings to recruit at'
      : blocked === mine.length
        ? (mine.length === 1 ? `Your own unit is standing on your ${mine[0].holding.type} — move it off to recruit`
                             : 'Your own units are standing on all your holdings — move one off to recruit')
        : 'Every free holding has already recruited this round (one per holding)';
    return { ok: false, why };
  }
  return { ok: true, cost, spawns };
}

function buildUnit(g, player, type, spawnHex) {
  // Re-validate at click-time to avoid stale-state bugs
  const cost = unitCost(g, type);
  if (player.gold < cost) return;
  if (!spawnHex.holding || spawnHex.holding.owner !== player.id) return;
  if (spawnHex.unit && spawnHex.unit.owner === player.id) return;
  const key = hexKey(spawnHex.q, spawnHex.r);
  if ((player.unitBuildsThisRound || []).includes(key)) return;

  player.gold -= cost;
  player.unitBuildsThisRound = [...(player.unitBuildsThisRound || []), key];
  const newUnit = { type, owner: player.id, moved: true, attacked: true };

  // Fresh check: is there an enemy on this holding right now?
  const besieger = (spawnHex.unit && spawnHex.unit.owner !== player.id) ? spawnHex.unit : null;

  if (besieger) {
    log(g, `${player.name} trains a ${type} at their ${spawnHex.holding.type} to break the siege!`, 'build');
    const beats = UNIT_TYPES[type].beats === besieger.type;
    const loses = UNIT_TYPES[besieger.type].beats === type;
    if (beats) {
      log(g, `The ${type} drives off the besieging ${besieger.type}`, 'combat');
      spawnHex.unit = newUnit;
      effect(g, { type: 'recruit', hex: { q: spawnHex.q, r: spawnHex.r }, unit: { type, owner: player.id }, siegeBreak: 'won', besieger: besieger.type });
    } else if (loses) {
      log(g, `The besieging ${besieger.type} cuts down the fresh ${type}`, 'combat');
      // besieger stays, new unit dies — gold spent, nothing gained
      effect(g, { type: 'recruit', hex: { q: spawnHex.q, r: spawnHex.r }, unit: { type, owner: player.id }, siegeBreak: 'lost', besieger: besieger.type });
    } else {
      // Same-type tie: BOTH die
      log(g, `Both the ${type} and besieging ${besieger.type} fall`, 'combat');
      spawnHex.unit = null;
      effect(g, { type: 'recruit', hex: { q: spawnHex.q, r: spawnHex.r }, unit: { type, owner: player.id }, siegeBreak: 'both', besieger: besieger.type });
    }
  } else {
    spawnHex.unit = newUnit;
    log(g, `${player.name} recruits a ${type} at their ${spawnHex.holding.type}`, 'build');
    effect(g, { type: 'recruit', hex: { q: spawnHex.q, r: spawnHex.r }, unit: { type, owner: player.id } });
  }
}

// --- Upkeep ---

function collectIncome(g, p) {
  // Called at START of each player's turn — income before spending
  // Players without a castle collect no income
  if (p.castleLost) {
    log(g, `${p.name} has no castle — skips income`, 'turn');
    return 0;
  }
  let income = calcFees(g, p);
  if (g.eventFlags.taxRevolt) {
    // Compute tax revolt targets lazily
    if (!g.eventFlags.taxRevoltTargets) {
      let maxF = -1;
      const alive = g.players.filter(pp => !pp.eliminated);
      alive.forEach(pp => maxF = Math.max(maxF, calcFees(g, pp)));
      g.eventFlags.taxRevoltTargets = alive.filter(pp => calcFees(g, pp) === maxF).map(pp => pp.id);
    }
    if (g.eventFlags.taxRevoltTargets.includes(p.id)) {
      income = Math.floor(income / 2);
      log(g, `Tax Revolt: ${p.name} collects half`);
    }
  }
  if (p.house.key === 'chancellor') income += 2;
  p.gold += income;
  return income;
}

// Pay supply at END OF YOUR TURN — locks in cost before AI can lengthen your routes.
function paySupply(g, p) {
  const units = g.hexes.filter(h => h.unit && h.unit.owner === p.id);
  if (!units.length) return;

  const supplyData = units.map(h => ({ hex: h, cost: supplyCost(g, h, p) }));
  supplyData.sort((a, b) => a.cost - b.cost); // pay cheap first

  const totalNeeded = supplyData.reduce((s, d) => s + (d.cost === Infinity ? 0 : d.cost), 0);
  const goldAtStart = p.gold;
  let paid = 0, deserted = 0;

  for (const { hex, cost } of supplyData) {
    if (cost === Infinity) {
      // No holding reachable at all — dies (checkSupplyCutoff catches outpost-only case)
      log(g, `${p.name}'s ${hex.unit.type} is cut off — dies`, 'combat');
      effect(g, { type: 'desert', hex: { q: hex.q, r: hex.r }, unit: { type: hex.unit.type, owner: p.id }, reason: 'cutoff' });
      hex.unit = null;
    } else if (p.gold >= cost) {
      p.gold -= cost;
      paid += cost;
    } else {
      log(g, `${p.name}'s ${hex.unit.type} deserts — need ${cost}g, only ${p.gold}g left`, 'combat');
      effect(g, { type: 'desert', hex: { q: hex.q, r: hex.r }, unit: { type: hex.unit.type, owner: p.id }, reason: 'unpaid', cost });
      hex.unit = null;
      deserted++;
    }
  }

  if (!p.ai && deserted > 0) {
    log(g, `  ${p.name} had ${goldAtStart}g, needed ${totalNeeded}g supply → ${deserted} unit(s) deserted`, 'combat');
    g._pauseAI = true;
  } else if (paid > 0) {
    log(g, `${p.name}: −${paid}g supply`);
  }
}

function doUpkeep(g) {
  // Supply is now paid at end of each player's turn, not here.
  // Upkeep just resets per-round flags.
  log(g, `— Upkeep —`, 'turn');
  g.players.forEach(p => {
    p.unitBuildsThisRound = [];
    p.rightOfPassage.clear();
    p._usedRoyalFavor = false;
  });
}

// Compute siege pressure on a holding right now:
//   - Enemy unit ON it (besieger) → +1
//   - Each adjacent enemy unit → +1, including bowmen...
//   - ...EXCEPT a bowman that has already fired a ranged shot (u.rangedUsed).
//     Melee combat does NOT count — a bowman that fought its way to position
//     still contributes siege pressure; only an explicit ranged attack uses up
//     their volley.
// Garrison does NOT shield from adjacent siege. Multi-faction siege works.
function siegePressure(g, hex) {
  if (!hex.holding || g.eventFlags.peace) return { dmg: 0, sources: [] };
  const ownerId = hex.holding.owner;
  let dmg = 0;
  const sources = [];

  if (hex.unit && hex.unit.owner !== ownerId && hex.unit.owner !== -1) {
    dmg++;
    sources.push(`${hex.unit.type} besieging`);
  }
  for (const [nq, nr] of neighbors(hex.q, hex.r)) {
    const nh = getHex(nq, nr);
    if (!nh || !nh.unit) continue;
    const u = nh.unit;
    if (u.owner === ownerId || u.owner === -1) continue;
    // Bowmen that already fired a ranged shot don't get a second volley at the walls.
    // (u.attacked from melee/siege does NOT block this — only explicit fire does.)
    if (u.type === 'bowman' && u.rangedUsed) continue;
    dmg++;
    sources.push(`adj ${u.type}`);
  }
  return { dmg, sources };
}

// End-of-round siege damage — applies siegePressure to every holding.
function applySiegeDamage(g) {
  if (g.eventFlags.peace) return;
  g.hexes.forEach(h => {
    if (!h.holding) return;
    const { dmg, sources } = siegePressure(g, h);
    if (dmg > 0) {
      const maxPop = HOLDING_TYPES[h.holding.type].pop;
      h.holding.damage = Math.min(h.holding.damage + dmg, maxPop);
      log(g, `Siege: ${pname(h.holding.owner)}'s ${h.holding.type} takes ${dmg} dmg (${sources.join(', ')}) → pop ${currentPop(h)}`, 'combat');
      effect(g, { type: 'siegeTick', hex: { q: h.q, r: h.r }, dmg, pop: currentPop(h), sources });
      checkCapture(h);
    }
  });
}

function doEnd(g) {
  // Siege damage ticks first — a castle falling here is a Conquest win
  applySiegeDamage(g);
  if (g.victory) return g.victory;

  // Heal holdings that aren't besieged (enemy unit on them)
  g.hexes.forEach(h => {
    if (h.holding && h.holding.damage > 0) {
      // A holding heals only when no enemy is touching it — on the tile OR
      // adjacent. v1.1 sims: with adjacent enemies allowed to heal, a castle
      // could never be taken (Conquest 0% at 2–4 players). Neutrals (owner
      // -1) are debris, not a siege, and don't block.
      const isEnemy = u => u && u.owner !== h.holding.owner && u.owner !== -1;
      const besieged = isEnemy(h.unit) || neighbors(h.q, h.r).some(([q, r]) => { const n = g.hexMap[hexKey(q, r)]; return n && isEnemy(n.unit); });
      if (!besieged) {
        h.holding.damage = Math.max(0, h.holding.damage - 1);
        effect(g, { type: 'heal', hex: { q: h.q, r: h.r }, pop: currentPop(h) });
      }
    }
  });

  // Safety: reconcile holding fiefs. A holding's tile must belong to its owner.
  // (Guards against any case that flips a fief out from under an uncaptured holding.)
  g.hexes.forEach(h => {
    if (h.holding && h.fief !== h.holding.owner) {
      h.fief = h.holding.owner;
    }
  });

  // Check victory. Ties within a round go to whoever is furthest past the
  // line; a dead heat goes to the house with more income.
  let best = null;
  for (const p of g.players) {
    if (p.eliminated) continue;
    const pop = totalPop(g, p);
    const income = calcFees(g, p);
    const over = Math.max(pop - WIN.pop, income - WIN.income);
    if (over < 0) continue;
    const cand = pop - WIN.pop >= income - WIN.income
      ? { winner: p, cond: 'Population', val: pop, over, tiebreak: income }
      : { winner: p, cond: 'Income', val: income, over, tiebreak: income };
    if (!best || cand.over > best.over || (cand.over === best.over && cand.tiebreak > best.tiebreak)) best = cand;
  }
  if (best) return { winner: best.winner, cond: best.cond, val: best.val };

  // Rotate initiative. The seat after this round's leader goes first next
  // round, so over a game every house gets its share of moving first (grab
  // the open land) AND moving last (your fief count is what gets scored).
  // Sims with a fixed order gave the last seat a large, permanent edge.
  let fp = (g.firstPlayerSeat + 1) % g.players.length;
  let guard = 0;
  while (g.players[fp].eliminated && guard++ < g.players.length) fp = (fp + 1) % g.players.length;
  g.firstPlayerSeat = fp;
  g.firstPlayer = fp;

  g.round++;
  return null;
}

// ============================================================================
// AI
// ============================================================================

function validateCastlePlacement(g, hex, player) {
  player = player || g.players[g.turn];
  if (hex.tract !== player.homeTract) return { ok: false, why: 'Castle must stand in your home province (the highlighted tiles)' };
  if (hex.terrain !== 'grass') return { ok: false, why: 'Must be grassland' };
  if (hex.holding) return { ok: false, why: 'Tile occupied' };
  const existing = g.hexes.filter(h => h.holding && h.holding.type === 'castle');
  for (const c of existing) {
    if (hexDist(hex, c) < 3) return { ok: false, why: 'Too close to another castle (min 3 hexes)' };
  }
  return { ok: true };
}

// Hexes the current placer may build on — for the board highlight.
function castleSites(g, player) {
  return g.hexes.filter(h => validateCastlePlacement(g, h, player).ok);
}

function aiPlaceCastle(g, p) {
  const candidates = castleSites(g, p);
  const center = (g.tractCenters || [])[p.homeTract];
  let best = null, bestScore = -Infinity;
  for (const h of candidates) {
    let openNeighbors = 0;
    for (const [nq, nr] of neighbors(h.q, h.r)) { const nh = getHex(nq, nr); if (nh && isPassable(nh)) openNeighbors++; }
    // Sit near the heart of the province (room to expand in every
    // direction) with as many walkable neighbours as possible.
    const centrality = center ? -hexDist(h, { q: center[0], r: center[1] }) * 1.5 : 0;
    const score = openNeighbors + centrality + rand();
    if (score > bestScore) { bestScore = score; best = h; }
  }
  // fallback: the province centre is always grass (generateMap guarantees it)
  if (!best) {
    best = center ? getHex(center[0], center[1]) : g.hexes.find(h => h.terrain === 'grass' && !h.holding);
  }
  return best;
}

function aiAct(g, p) {
  if (g.difficulty === 'brutal') return aiActBrutal(g, p);
  // Strategy: expand toward unclaimed, build holdings when affordable, attack if RPS-favorable
  const myUnits = g.hexes.filter(h => h.unit && h.unit.owner === p.id);

  // Difficulty tuning
  const diff = g.difficulty || 'medium';
  const humanIds = new Set(g.players.filter(pp => !pp.ai).map(pp => pp.id));
  const isHumanTarget = (id) => humanIds.has(id);
  // Easy: lots of noise + never siege humans. Hard: bonus for attacking humans.
  const noise = diff === 'easy' ? 8 : diff === 'tutorial' ? 6 : 2;
  const humanSiegePenalty = (diff === 'easy' || diff === 'tutorial') ? -30 : 0;
  const humanAggroBonus = diff === 'hard' ? 5 : 0;

  for (const uh of myUnits) {
    if (uh.unit.moved) continue;
    const moves = getValidMoves(uh);
    if (!moves.length) continue;

    // Score moves
    let best = null, bestScore = -Infinity;
    for (const m of moves) {
      let score = 0;
      if (m.hex.fief === null) score += 10; // unclaimed
      if (m.hex.fief !== null && m.hex.fief !== p.id) {
        score += 6; // flip enemy
        if (isHumanTarget(m.hex.fief)) score += humanAggroBonus;
      }
      // Knight pass-through value
      if (m.path) {
        for (const via of m.path) {
          if (via.fief === null) score += 6;
          else if (via.fief !== p.id) score += 4;
        }
      }
      if (m.combat) {
        const def = m.hex.unit;
        if (UNIT_TYPES[uh.unit.type].beats === def.type) score += 15;
        else if (UNIT_TYPES[def.type].beats === uh.unit.type) score -= 20;
        else score -= 5; // tie = both die
        if (isHumanTarget(def.owner)) score += humanAggroBonus;
      }
      if (m.siege) {
        score += 8;
        if (m.hex.holding && isHumanTarget(m.hex.holding.owner)) {
          score += humanSiegePenalty; // easy/tutorial AI leaves human holdings alone
          score += humanAggroBonus;    // hard AI hunts them
        }
        // A castle with its walls nearly down is a Conquest win waiting to happen
        if (m.hex.holding && m.hex.holding.type === 'castle' && currentPop(m.hex) <= 2 && diff !== 'easy' && diff !== 'tutorial') score += 25;
      }
      // prefer moves that keep supply cheap and anchored
      const sc = supplyCost(g, m.hex, p);
      score -= sc * 2;
      if (sc === Infinity) score -= 50;
      if (!hasSupplyAnchor(g, m.hex, p)) score -= 100; // would die at end of turn
      score += rand() * noise;
      if (score > bestScore) { bestScore = score; best = m; }
    }
    if (best && bestScore > -10) {
      executeMove(uh, best.hex, best.path, best.endsMove);
    } else {
      uh.unit.moved = true; // skip
    }
  }

  // Bowman ranged
  const bowmen = g.hexes.filter(h => h.unit && h.unit.owner === p.id && h.unit.type === 'bowman' && !h.unit.attacked);
  for (const bh of bowmen) {
    const targets = getBowmanTargets(bh);
    // Prefer spearmen (clean kill), then holdings, then bowmen (trade)
    const spearTargets = targets.filter(t => t.type === 'unit' && t.hex.unit.type === 'spearman');
    const holdTargets = targets.filter(t => t.type === 'holding');
    const bowTargets = targets.filter(t => t.type === 'unit' && t.hex.unit.type === 'bowman');
    const pick = spearTargets[0] || holdTargets[0] || bowTargets[0];
    if (pick) executeBowmanAttack(bh, pick.hex, pick.type);
  }
}

function aiSpend(g, p) {
  if (g.difficulty === 'brutal') return aiSpendBrutal(g, p);
  const army = countUnits(g, p.id);

  // Reserve gold for supply — paid at end of turn, AFTER spending.
  // Fresh recruit is moved:true so it stays on its spawn (cost 0) this turn.
  let supplyReserve = 0;
  g.hexes.forEach(h => {
    if (h.unit && h.unit.owner === p.id) {
      const c = supplyCost(g, h, p);
      if (c !== Infinity) supplyReserve += c;
    }
  });
  const canSpend = Math.max(0, p.gold - supplyReserve);

  // Closest win condition drives spend
  // Holdings first when affordable — they drive BOTH remaining win paths.
  // (The old gate compared against the Army win, which no longer exists.)
  // Priority 1: upgrade an outpost to village (big pop jump, supply anchor)
  if (canSpend >= holdingCost(g, p, 'village')) {
    const upgradable = g.hexes.filter(h => canBuildHolding(g, h, p, 'village').ok);
    if (upgradable.length) {
      // Prefer the outpost furthest from castle (extends supply reach)
      const castle = g.hexes.find(h => h.holding && h.holding.type === 'castle' && h.holding.owner === p.id);
      let target = upgradable[0];
      if (castle) {
        let best = -1;
        for (const h of upgradable) { const d = hexDist(h, castle); if (d > best) { best = d; target = h; }}
      }
      const res = canBuildHolding(g, target, p, 'village');
      p.gold -= res.cost;
      g.componentsUsed.outpost--;
      const dmg = target.holding.damage || 0;
      target.holding = { type: 'village', owner: p.id, damage: dmg };
      g.componentsUsed.village++;
      log(g, `${p.name} upgrades an Outpost to a Village`, 'build');
      effect(g, { type: 'build', hex: { q: target.q, r: target.r }, what: 'village', player: p.id });
      return;
    }
  }

  // Priority 2: build a new outpost
  if (canSpend >= holdingCost(g, p, 'outpost')) {
    const candidates = g.hexes.filter(h => canBuildHolding(g, h, p, 'outpost').ok);
    if (candidates.length) {
      const target = candidates[Math.floor(rand() * candidates.length)];
      const res = canBuildHolding(g, target, p, 'outpost');
      p.gold -= res.cost;
      target.holding = { type: 'outpost', owner: p.id, damage: 0 };
      g.componentsUsed.outpost++;
      log(g, `${p.name} builds an Outpost`, 'build');
      effect(g, { type: 'build', hex: { q: target.q, r: target.r }, what: 'outpost', player: p.id });
      return;
    }
  }

  // Priority 3: build a unit
  if (!(p.unitBuildsThisRound || []).length) {
    let type = army < 3 ? 'spearman' : (army % 3 === 0 ? 'knight' : army % 3 === 1 ? 'bowman' : 'spearman');
    const spawns = getUnitSpawns(g, p);
    if (!spawns.length) return;

    // Find any besieged spawn — if so, build the RPS counter there
    const besieged = spawns.find(h => h.unit && h.unit.owner !== p.id);
    let spawnAt;
    if (besieged) {
      const besiegerType = besieged.unit.type;
      for (const [t, def] of Object.entries(UNIT_TYPES)) {
        if (def.beats === besiegerType) { type = t; break; }
      }
      spawnAt = besieged;
    } else {
      // Prefer castle, else village, else outpost
      spawnAt = spawns.find(h => h.holding.type === 'castle')
             || spawns.find(h => h.holding.type === 'village')
             || spawns[0];
    }

    // If besieged, spend even into supply reserve — siege-break is life or death
    const budget = besieged ? p.gold : canSpend;
    if (budget >= unitCost(g, type)) {
      buildUnit(g, p, type, spawnAt);
    }
  }
}

// ============================================================================
// BRUTAL AI — plays the whole table, not just its own economy.
//
// The first brutal AI raced Population/Income well but never looked up: it bought a village before
// breaking a siege on its own castle, made one purchase a turn, walked units into fights they lose,
// and only chased the Income leader. A human who marched three units at its castle simply won.
//
// Every turn it now reads the board first (brutalRead):
//   - how close every rival is to winning: Population, Income, or Conquest, where Conquest means a
//     castle it is pressing falls within a few rounds at the current siege pressure;
//   - which enemy units press a castle (its own or anyone's), and how urgent each one is.
// Then, in order:
//   1. Defend: break a siege on its own holdings by recruiting the counter on them, and recruit the
//      counter at the castle when enemies close in (brutalDefendSpend).
//   2. Move units greedily, best move on the board first (brutalMoves). Killing a unit that presses
//      a castle, above all its own, outranks everything; so does trading a unit to stop a rival who
//      is about to win. Unguarded outposts and villages are taken (at 0 walls the unit
//      standing on one captures it), and a move that claims a tile of an enemy supply line is valued
//      by the units it starves: they die at the end of our turn (brutalCutValue). Units never walk into a fight they lose, and avoid tiles where an enemy that
//      beats them can reach them next turn unless the prize is worth it.
//   3. Shoot with bowmen at the most dangerous target (brutalShoot), before and after moving —
//      including the last wall of a holding a unit can then walk into this turn.
//   4. Spend what is left: army floor, then villages and outposts (aiSpendBrutal).
// ============================================================================

// Tuned over ~10,000 all-AI games against the first brutal AI and a castle-rushing bot:
//   floorCap/floorDiv — army floor min(4, 2 + round/4); a bigger floor starved villages and dragged games out
//   march — army size before units march on a castle
//   lead — a rival's win progress (0..1) at which the table starts ganging up on them
const BRUTAL_TUNE = { floorCap: 4, floorDiv: 4, march: 4, lead: 0.7, combo: 10 };
// The table leans on the humans: a human rival reads closer to winning than they are, so the
// computer houses gang up on them sooner, and their land and units are worth more. Brutal is meant
// to be that hard: Kevin's bar is a decent human winning about 14% of 4-player games. Measured with
// scripted human strategies at 4 players: castle rush 11.5%, economy with supply cuts 13%, the AI's
// own play in the human seat 14%. Only a human who is actually leading draws the castle march.
const BRUTAL_HUMAN_TILT = { danger: 0.12, kill: 6, land: 3 };
const brutalIsHuman = (g, o) => !o.ai;
const BRUTAL_BEATEN_BY = { spearman: 'bowman', bowman: 'knight', knight: 'spearman' };

function brutalRead(g, p) {
  const rivals = g.players.filter(o => !o.eliminated && o.id !== p.id);
  const castles = g.hexes.filter(h => h.holding && h.holding.type === 'castle' && h.holding.owner >= 0);
  const presses = (u, owner) => u && u.owner >= 0 && u.owner !== owner && !(u.type === 'bowman' && u.rangedUsed);
  const sieges = castles.map(c => {
    const owner = c.holding.owner, by = {}, units = [];
    let pressure = 0;
    const add = h => { if (h && presses(h.unit, owner)) { by[h.unit.owner] = (by[h.unit.owner] || 0) + 1; pressure++; units.push(h); } };
    add(c);
    for (const [q, r] of neighbors(c.q, c.r)) add(getHex(q, r));
    const walls = currentPop(c);
    return { castle: c, owner, by, units, pressure, walls, rounds: pressure ? Math.ceil(walls / pressure) : Infinity };
  });
  const mine = sieges.find(s => s.owner === p.id) || null;

  // 0..1 is the race to Population/Income; above 1 means a castle is about to fall to them.
  const danger = {};
  for (const o of rivals) {
    let d = Math.max(totalPop(g, o) / WIN.pop, calcFees(g, o) / WIN.income);
    for (const s of sieges) {
      if (!s.by[o.id] || s.owner === o.id) continue;
      d = Math.max(d, s.rounds <= 1 ? 1.3 : s.rounds <= 2 ? 1.1 : s.rounds <= 3 ? 0.9 : 0.7);
    }
    danger[o.id] = d + (brutalIsHuman(g, o) ? BRUTAL_HUMAN_TILT.danger : 0);
  }
  let leader = null;
  for (const o of rivals) if (!leader || danger[o.id] > danger[leader.id]) leader = o;
  // How hard to go after the leader: nothing while the race is open, full weight once they are a
  // round or two from winning. Ganging up earlier just made every game a 40-round grind.
  const lw = leader ? Math.max(0, Math.min(1.5, (danger[leader.id] - BRUTAL_TUNE.lead) / 0.4)) : 0;

  // Urgency of killing each enemy unit that presses a castle. Our own castle is existential.
  const urgent = new Map();
  for (const s of sieges) {
    for (const h of s.units) {
      if (h.unit.owner === p.id) continue;
      let u = s.owner === p.id
        ? 60 + (s.rounds <= 2 ? 40 : 0) + (s.walls <= 2 ? 30 : 0)
        : s.rounds <= 2 ? 45 : s.rounds <= 3 ? 25 : 10;
      urgent.set(h, Math.max(urgent.get(h) || 0, u));
    }
  }
  // Enemies closing on our castle: within 2 tiles, not yet pressing.
  const myCastle = mine ? mine.castle : null;
  const closing = myCastle ? g.hexes.filter(h => h.unit && h.unit.owner >= 0 && h.unit.owner !== p.id && hexDist(h, myCastle) === 2) : [];
  for (const h of closing) urgent.set(h, Math.max(urgent.get(h) || 0, 18));

  // Enemy supply lines. Supply runs only through its owner's own land, and after every turn a unit
  // with no line to a castle or village dies — so claiming one tile of a line can kill every unit
  // behind it. Keep each enemy unit's current shortest line; brutalCutValue tests a move against it.
  const lines = [];
  for (const h of g.hexes) {
    if (!h.unit || h.unit.owner < 0 || h.unit.owner === p.id) continue;
    const o = g.players[h.unit.owner];
    const t = supplyTrace(g, h, o, { anchorTypes: ['castle', 'village'], returnPath: true });
    if (!t.path || t.path.length < 3) continue;
    lines.push({ hex: h, owner: o, tiles: new Set(t.path.slice(1, -1).map(x => hexKey(x.q, x.r))) });
  }

  return { rivals, sieges, mine, myCastle, danger, leader, lw, urgent, closing, lines };
}

// Enemy units that beat `type` and could reach `hex` on their next turn.
function brutalExposure(g, p, hex, type) {
  const killer = BRUTAL_BEATEN_BY[type];
  let n = 0;
  for (const h of g.hexes) {
    if (!h.unit || h.unit.owner < 0 || h.unit.owner === p.id || h.unit.type !== killer) continue;
    // knights ride two tiles; a bowman steps one and shoots one
    const reach = h.unit.type === 'spearman' ? 1 : 2;
    if (hexDist(h, hex) <= reach) n++;
  }
  return n;
}

// What a move is worth in enemy units starved of supply. Claims the tiles the move would claim, asks
// every enemy unit whose line crosses them whether it can still reach home, then puts the land back.
function brutalCutValue(g, p, R, uh, m) {
  const claimed = [m.hex, ...(m.path || [])].filter(h => h.terrain !== 'lake' && !(h.holding && h.holding.owner !== p.id) && h.fief !== p.id);
  if (!claimed.length) return 0;
  const keys = claimed.map(h => hexKey(h.q, h.r));
  const hit = R.lines.filter(l => l.hex !== m.hex && keys.some(k => l.tiles.has(k)));
  if (!hit.length) return 0;
  const was = claimed.map(h => h.fief);
  claimed.forEach(h => { h.fief = p.id; });
  let v = 0;
  for (const l of hit) {
    if (hasSupplyAnchor(g, l.hex, l.owner)) continue;
    v += UNIT_TYPES[l.hex.unit.type].cost + (R.urgent.get(l.hex) || 0) + (R.leader && l.owner.id === R.leader.id ? 10 * R.lw : 0);
  }
  claimed.forEach((h, i) => { h.fief = was[i]; });
  return v;
}

function brutalScoreMove(g, p, R, uh, m, armySize) {
  const u = uh.unit, dest = m.hex, lead = R.leader, dl = R.lw;
  let s = 0;

  // Land. The most dangerous rival's land is worth more: it is their Income.
  const humanLand = h => h.fief !== null && h.fief >= 0 && h.fief !== p.id && brutalIsHuman(g, g.players[h.fief]) ? BRUTAL_HUMAN_TILT.land : 0;
  const land = h => (h.fief === null ? 12 : h.fief === p.id ? 0 : (lead && h.fief === lead.id) ? 8 + 12 * dl : 8) + humanLand(h);
  if (!(dest.holding && dest.holding.owner !== p.id)) s += land(dest);
  for (const via of m.path || []) if (!via.holding || via.holding.owner === p.id) s += land(via) * 0.7;

  const unitWorth = t => UNIT_TYPES[t].cost;
  const killValue = h => 14 + (R.urgent.get(h) || 0) + (lead && h.unit.owner === lead.id ? 12 * dl : 0) + (h.unit.owner >= 0 && brutalIsHuman(g, g.players[h.unit.owner]) ? BRUTAL_HUMAN_TILT.kill : 0);
  function holdingSiegeValue(dest, uh) {
    const h = dest.holding;
    if (h.type === 'castle') {
      const sg = R.sieges.find(x => x.castle === dest);
      const pressure = (sg ? sg.pressure : 0) + 1;
      const rounds = Math.ceil(currentPop(dest) / pressure);
      return 30 + (rounds <= 1 ? 90 : rounds <= 2 ? 45 : rounds <= 3 ? 20 : 0) + (currentPop(dest) === 0 ? 200 : 0);   // at 0 walls, walking in takes it
    }
    // Outposts and villages. Every enemy unit on or beside it takes a wall a round; at 0 walls the
    // unit standing on it captures it. An unguarded outpost falls at the end of this round.
    let pressure = 1;
    for (const [q, r] of neighbors(dest.q, dest.r)) { const n = getHex(q, r); if (n && n.unit && n.unit.owner >= 0 && n.unit.owner !== h.owner && n !== uh) pressure++; }
    const walls = currentPop(dest), rounds = Math.ceil(walls / pressure);
    return (walls === 0 ? 45 : rounds <= 1 ? 26 : rounds <= 2 ? 14 : 6) + HOLDING_TYPES[h.type].pop * 2 + (lead && h.owner === lead.id ? 30 * dl : 0);
  }

  if (m.combat) {
    const def = dest.unit;
    const beats = UNIT_TYPES[u.type].beats === def.type, loses = UNIT_TYPES[def.type].beats === u.type;
    const tie = !beats && !loses;
    if (beats) s += killValue(dest);
    else if (loses || (tie && dest.terrain === 'forest')) s -= unitWorth(u.type) + 30;   // never walk into a loss
    else {
      s += killValue(dest) - unitWorth(u.type) - 6;                                         // a trade: only when it stops something
      // A trade on an enemy holding leaves it bare. If another of our units can step on this turn,
      // the trade opens the siege: one unit spent to kill the garrison, the next one takes the walls.
      if (dest.holding && dest.holding.owner !== p.id && g.hexes.some(f => f !== uh && f.unit && f.unit.owner === p.id && !f.unit.moved && getValidMoves(f).some(mv => mv.hex === dest)))
        s += holdingSiegeValue(dest, uh) + BRUTAL_TUNE.combo;
    }
  }

  // A garrisoned holding is only besieged if we win the fight for it. Scoring the siege on a lost
  // fight sent units to die on castle garrisons (about one a game at four players).
  const winsFight = !m.combat || UNIT_TYPES[u.type].beats === dest.unit.type;
  if (m.siege || (m.combat && winsFight && dest.holding && dest.holding.owner !== p.id)) s += holdingSiegeValue(dest, uh);

  // Starving enemy units by claiming a tile of their supply line.
  if (winsFight && !m.siege) s += brutalCutValue(g, p, R, uh, m);

  // Pressing an enemy castle from next door adds a point of siege every round without a fight.
  // Six houses sit three tiles apart: open castle hunting there ended 95% of games by round 9.
  // At six, only go after a house that is about to win, or walls that are about to fall.
  const huntable = x => g.players.length < 6 || (lead && x.owner === lead.id && dl >= 0.5) || x.rounds <= 2;
  const castleNext = R.sieges.filter(x => x.owner !== p.id && huntable(x) && hexDist(x.castle, dest) === 1 && hexDist(x.castle, uh) > 1);
  for (const x of castleNext) {
    const rounds = Math.ceil(x.walls / (x.pressure + 1));
    s += 10 + (rounds <= 2 ? 30 : rounds <= 3 ? 12 : 0) + (lead && x.owner === lead.id ? 10 * dl : 0);
  }

  // Leaving the side of an enemy castle we are already pressing throws that pressure away.
  const pressingNow = R.sieges.filter(x => x.owner !== p.id && hexDist(x.castle, uh) <= 1);
  for (const x of pressingNow) if (hexDist(x.castle, dest) > 1 && !(m.siege && dest === x.castle)) s -= 15 + (x.rounds <= 3 ? 20 : 0);

  // Home defence: when enemies close on our castle, units come back and stand where they can strike.
  if (R.myCastle && (R.mine.pressure > 0 || R.closing.length)) {
    const dNow = hexDist(uh, R.myCastle), dNext = hexDist(dest, R.myCastle);
    if (dNext < dNow) s += 8 * (dNow - dNext);
    for (const [h, urg] of R.urgent) {
      if (h.unit.owner === p.id) continue;
      if (UNIT_TYPES[u.type].beats === h.unit.type && hexDist(dest, h) === 1) s += Math.min(25, urg / 3);
    }
  }

  // March on a castle once there is an army: the most dangerous rival's first, else the weakest walls.
  if (armySize >= BRUTAL_TUNE.march) {
    const targets = R.sieges.filter(x => x.owner !== p.id && huntable(x));
    if (targets.length) {
      // Each unit weighs the castles from where it stands. Without the distance term every tie went
      // to whichever castle came first in the board list, and all houses piled onto the same seat.
      const val = x => (lead && x.owner === lead.id ? 3 * dl : 0) + (lead && x.owner === lead.id && brutalIsHuman(g, lead) ? 1 : 0) - x.walls / 2 + x.pressure - hexDist(uh, x.castle) * 0.6;
      const pick = targets.reduce((a, b) => val(b) > val(a) ? b : a);
      const dNow = hexDist(uh, pick.castle), dNext = hexDist(dest, pick.castle);
      if (dNext < dNow) s += 5 + 2 * (dNow - dNext);
    }
  }

  // Standing where an enemy that beats us can strike next turn. Forest makes a same-type tie a hold.
  const exposed = brutalExposure(g, p, dest, u.type);
  if (exposed) s -= Math.min(2, exposed) * (unitWorth(u.type) * 0.6);

  // Stepping straight back onto the tile this unit just left undoes its last move. Without this,
  // thousands of units walked back and forth between the same two tiles.
  if (u.brutalLeft === hexKey(dest.q, dest.r) && !m.combat && !m.siege) s -= 14;

  // Supply. A unit that dies of hunger is worth nothing.
  if (!hasSupplyAnchor(g, dest, p)) s -= 200;
  s -= supplyCost(g, dest, p) * 1.2;

  // Noise of a few points: close calls go different ways from game to game, so the AI cannot be
  // read and punished move for move (a 12-round lookahead bot beat it 92% of 2-player games).
  return s + rand() * 4;
}

function brutalMoves(g, p) {
  // Greedy over the whole army: execute the single best move on the board, re-read, repeat.
  for (let guard = 0; guard < 40; guard++) {
    const R = brutalRead(g, p);
    const armySize = countUnits(g, p.id);
    let best = null;
    for (const uh of g.hexes) {
      if (!uh.unit || uh.unit.owner !== p.id || uh.unit.moved) continue;
      const moves = getValidMoves(uh);
      if (!moves.length) { uh.unit.moved = true; continue; }
      // Staying put is a move too: holding a castle's side or a good post beats a pointless step.
      let stay = 0;
      for (const x of R.sieges) if (x.owner !== p.id && hexDist(x.castle, uh) <= 1) stay += 15 + (x.rounds <= 3 ? 20 : 0);
      if (R.myCastle && (R.mine.pressure > 0 || R.closing.length) && hexDist(uh, R.myCastle) <= 1) stay += 12;
      stay -= Math.min(2, brutalExposure(g, p, uh, uh.unit.type)) * UNIT_TYPES[uh.unit.type].cost * 0.6;
      for (const m of moves) {
        // Peace Treaty: no fighting and no sieges this round; the engine refuses them and leaves
        // the unit unmoved, and retrying them froze the whole army.
        if (g.eventFlags.peace && (m.combat || m.siege)) continue;
        const sc = brutalScoreMove(g, p, R, uh, m, armySize) - stay;
        if (!best || sc > best.sc) best = { uh, m, sc };
      }
    }
    // Small land-grabbing moves are much of this AI's strength: demanding a clear margin over standing
    // still let a castle rush win 28% instead of 11%. Back-and-forth is stopped in brutalScoreMove.
    if (!best || best.sc <= -8) break;
    const from = best.uh, unit = from.unit;
    executeMove(from, best.m.hex, best.m.path, best.m.endsMove);
    if (g.phase === 'over') return;
    if (from.unit === unit && !unit.moved) unit.moved = true;   // refused: never try it again this turn
    else unit.brutalLeft = hexKey(from.q, from.r);
  }
  g.hexes.forEach(h => { if (h.unit && h.unit.owner === p.id && !h.unit.moved && !getValidMoves(h).length) h.unit.moved = true; });
}

function brutalShoot(g, p) {
  const R = brutalRead(g, p), lead = R.leader, dl = R.lw;
  const bowmen = g.hexes.filter(h => h.unit && h.unit.owner === p.id && h.unit.type === 'bowman' && !h.unit.attacked);
  for (const bh of bowmen) {
    let pick = null, bestV = 0;
    for (const t of getBowmanTargets(bh)) {
      let v = 0;
      if (t.type === 'unit') {
        const d = t.hex.unit;
        const kills = d.type === 'spearman', trade = d.type === 'bowman';
        const worth = 14 + (R.urgent.get(t.hex) || 0) + (lead && d.owner === lead.id ? 10 * dl : 0);
        if (kills) v = worth; else if (trade) v = worth - UNIT_TYPES.bowman.cost - 4; else v = 0;
      } else {
        const h = t.hex.holding;
        // Walls: worth it when the hit takes a castle now, or slows the most dangerous rival.
        if (h.type === 'castle' && currentPop(t.hex) === 1 && t.hex.unit && t.hex.unit.owner === p.id) v = 300;
        else if (currentPop(t.hex) === 1 && !t.hex.unit && g.hexes.some(f => f.unit && f.unit.owner === p.id && !f.unit.moved && f !== bh && getValidMoves(f).some(mv => mv.hex === t.hex)))
          v = h.type === 'castle' ? 250 : 24;   // knock the last wall down and walk in this turn
        else if (h.type === 'castle') v = 6 + (lead && h.owner === lead.id ? 8 * dl : 0);
        else v = 3 + (lead && h.owner === lead.id ? 12 * dl : 0);
      }
      if (v > bestV) { bestV = v; pick = t; }
    }
    // An unfired bowman beside an enemy holding already presses it at end of round; only fire when it pays more.
    if (pick) executeBowmanAttack(bh, pick.hex, pick.type);
    if (g.phase === 'over') return;
  }
}

function brutalCounter(types) {
  // The unit that beats the most of these enemy types.
  const tally = { spearman: 0, bowman: 0, knight: 0 };
  for (const t of types) tally[BRUTAL_BEATEN_BY[t]]++;
  return Object.entries(tally).sort((a, b) => b[1] - a[1])[0][0];
}

function brutalSupplyBill(g, p) {
  let r = 0;
  g.hexes.forEach(h => { if (h.unit && h.unit.owner === p.id) { const c = supplyCost(g, h, p); if (c !== Infinity) r += c; } });
  // moves this turn usually lengthen lines: keep a gold per unit on top
  return r + countUnits(g, p.id);
}

function brutalDefendSpend(g, p) {
  // Break every siege on our holdings, castle first. A siege on the castle is existential and may
  // spend into the supply money; anything else keeps it, or units desert at the end of the turn.
  const besieged = g.hexes.filter(h => h.holding && h.holding.owner === p.id && h.unit && h.unit.owner >= 0 && h.unit.owner !== p.id)
    .sort((a, b) => (b.holding.type === 'castle') - (a.holding.type === 'castle'));
  for (const h of besieged) {
    const used = (p.unitBuildsThisRound || []).includes(hexKey(h.q, h.r));
    const type = BRUTAL_BEATEN_BY[h.unit.type];
    const spare = h.holding.type === 'castle' ? p.gold : p.gold - brutalSupplyBill(g, p);
    if (!used && spare >= unitCost(g, type)) buildUnit(g, p, type, h);
  }
  // Enemies beside or closing on the castle: put their counter on the walls. It fights anything
  // that tries to step on, and strikes next turn.
  const R = brutalRead(g, p);
  if (R.myCastle && !R.myCastle.unit && (R.mine.pressure > 0 || R.closing.length)) {
    const types = [...R.mine.units, ...R.closing].map(h => h.unit.type);
    const type = brutalCounter(types);
    const used = (p.unitBuildsThisRound || []).includes(hexKey(R.myCastle.q, R.myCastle.r));
    // Once enemies actually press the walls, every gold goes to the counter; while they are only
    // closing in, keep the supply money. (Holding it back under siege let a castle rush win 28%.)
    const spare = R.mine.pressure > 0 ? p.gold : p.gold - brutalSupplyBill(g, p);
    if (!used && spare >= unitCost(g, type)) buildUnit(g, p, type, R.myCastle);
  }
}

function aiActBrutal(g, p) {
  brutalDefendSpend(g, p);
  brutalShoot(g, p);
  if (g.phase === 'over') return;
  brutalMoves(g, p);
  if (g.phase === 'over') return;
  brutalShoot(g, p);
}

function brutalBuildHolding(g, p, t, type) {
  const r = canBuildHolding(g, t, p, type);
  p.gold -= r.cost;
  if (type === 'village') { g.componentsUsed.outpost--; t.holding = { type: 'village', owner: p.id, damage: t.holding.damage || 0 }; }
  else t.holding = { type: 'outpost', owner: p.id, damage: 0 };
  g.componentsUsed[type]++;
  log(g, type === 'village' ? `${p.name} upgrades an Outpost to a Village` : `${p.name} builds an Outpost`, 'build');
  effect(g, { type: 'build', hex: { q: t.q, r: t.r }, what: type, player: p.id });
}

function aiSpendBrutal(g, p) {
  if (g.phase === 'over') return;
  const reserve = () => {
    let r = 0;
    g.hexes.forEach(h => { if (h.unit && h.unit.owner === p.id) { const c = supplyCost(g, h, p); if (c !== Infinity) r += c; } });
    return r;
  };
  const castle = g.hexes.find(h => h.holding && h.holding.type === 'castle' && h.holding.owner === p.id);
  const far = list => { let t = list[Math.floor(rand() * list.length)], bd = -1; if (castle) for (const h of list) { const d = hexDist(h, castle) + rand() * 0.5; if (d > bd) { bd = d; t = h; } } return t; };

  for (let step = 0; step < 4; step++) {
    const budget = Math.max(0, p.gold - reserve());
    const R = brutalRead(g, p);
    const army = countUnits(g, p.id);
    // Enemy units anywhere near our land decide what we recruit.
    const nearTypes = g.hexes.filter(h => h.unit && h.unit.owner >= 0 && h.unit.owner !== p.id && g.hexes.some(f => f.fief === p.id && hexDist(f, h) <= 2)).map(h => h.unit.type);
    const want = Math.min(BRUTAL_TUNE.floorCap, 2 + Math.floor(g.round / BRUTAL_TUNE.floorDiv)) + (nearTypes.length >= 2 ? 1 : 0);
    const spawns = getUnitSpawns(g, p).filter(h => !(h.unit && h.unit.owner !== p.id));
    const recruit = (type) => {
      const at = spawns.find(h => h.holding.type === 'castle') || spawns.find(h => h.holding.type === 'village') || spawns[0];
      if (!at || budget < unitCost(g, type)) return false;
      buildUnit(g, p, type, at); return true;
    };
    const typeFor = () => nearTypes.length ? brutalCounter(nearTypes) : (budget >= unitCost(g, 'knight') + 15 ? 'knight' : 'spearman');

    // 1. Army floor, and one more when enemies stand near our land.
    if (army < want && spawns.length && recruit(typeFor())) continue;
    // Castle under siege and low: hold the gold for next turn's counter instead of building.
    if (R.mine && R.mine.pressure > 0 && R.mine.walls <= 3) break;
    // 2. Village: the best purchase in the game (+2 pop and a supply anchor).
    const villageable = g.hexes.filter(h => canBuildHolding(g, h, p, 'village').ok);
    if (villageable.length && budget >= holdingCost(g, p, 'village')) {
      brutalBuildHolding(g, p, far(villageable), 'village');
      continue;
    }
    // 3. Outpost, so there is always a village one purchase away.
    const haveOutpost = g.hexes.some(h => h.holding && h.holding.type === 'outpost' && h.holding.owner === p.id);
    const outpostable = g.hexes.filter(h => canBuildHolding(g, h, p, 'outpost').ok);
    if (!haveOutpost && outpostable.length && budget >= holdingCost(g, p, 'outpost')) {
      brutalBuildHolding(g, p, far(outpostable), 'outpost');
      continue;
    }
    // 4. Rich and a rival is close to winning: more units to stop them.
    if (R.lw >= 0.5 && spawns.length && budget >= 45 && recruit(typeFor())) continue;
    break;
  }
}

function aiPickDisbandVictim(g, p, units) {
  // disband furthest from holdings
  let worst = units[0], worstCost = -1;
  for (const u of units) {
    const c = supplyCost(g, u, p);
    if (c > worstCost) { worstCost = c; worst = u; }
  }
  worst._lastUnitType = worst.unit.type;
  return worst;
}

// ============================================================================
// GAME LOOP
// ============================================================================

function advancePhase() {
  if (G.phase === 'setup-castle') {
    // Reverse turn order — walk backward around the table. Can't use
    // G.turn < 0 as the exit anymore since firstPlayer is random (the walk
    // might wrap through 0 mid-sequence). Count placements instead.
    G.castlesPlaced++;
    G.turn = (G.turn - 1 + G.players.length) % G.players.length;
    if (G.castlesPlaced >= G.players.length) {
      // All castles placed — place starting spearmen & fiefs
      G.players.forEach(p => {
        const castle = G.hexes.find(h => h.holding && h.holding.type === 'castle' && h.holding.owner === p.id);
        castle.fief = p.id;
        castle.unit = { type: 'spearman', owner: p.id, moved: false, attacked: false };
        if (p.house.key === 'marshal') {
          // place 2nd spearman adjacent if possible
          for (const [nq, nr] of neighbors(castle.q, castle.r)) {
            const nh = getHex(nq, nr);
            if (nh && isPassable(nh) && !nh.unit) {
              nh.unit = { type: 'spearman', owner: p.id, moved: false, attacked: false };
              nh.fief = p.id;
              break;
            }
          }
        }
      });
      log(G, `=== ROUND 1 ===`, 'turn');
      effect(G, { type: 'round', n: 1 });
      G.phase = 'act';
      G.turn = G.firstPlayer;
      startPlayerTurn(G, G.players[G.turn]);
    }
  } else if (G.phase === 'act') {
    // End of this player's turn: pay supply now (locks in cost before AI can interfere)
    const endingPlayer = G.players[G.turn];
    if (!endingPlayer.eliminated) paySupply(G, endingPlayer);
    // Supply cutoff check — any unit with no castle/village path dies NOW
    checkSupplyCutoff(G);
    // Next player
    let next = (G.turn + 1) % G.players.length;
    let loops = 0;
    while (G.players[next].eliminated && loops < G.players.length) { next = (next + 1) % G.players.length; loops++; }

    if (next === G.firstPlayer || loops >= G.players.length) {
      // All players acted — upkeep
      G.phase = 'upkeep';
      doUpkeep(G);
      G.phase = 'end';
      const victory = doEnd(G);
      if (victory) { endGame(G, victory); return; }
      // Reset round
      G.hexes.forEach(h => { if (h.unit) { h.unit.moved = false; h.unit.movesUsed = 0; h.unit.attacked = false; h.unit.rangedUsed = false; }});
      log(G, `=== ROUND ${G.round} ===`, 'turn');
      effect(G, { type: 'round', n: G.round });

      // Age the current event. Multi-round events (just Winter right now,
      // duration:2) stay on the table: card is upright its first round,
      // tilts on round 2, then goes to discard. Everything else is duration 1
      // so ages out immediately and a fresh card is drawn below.
      //
      // The physical metaphor matters for the thaw: a unit supplied only
      // through ice has one full round to walk back to solid ground before
      // the lake opens under the supply line. The tilt is your warning.
      const dur = G.currentEvent ? (G.currentEvent.duration || 1) : 0;
      G.eventAge = (G.eventAge || 0) + 1;
      if (G.currentEvent && G.eventAge < dur) {
        // Event persists — keep flags, don't draw. Card tilts in the sidebar.
        log(G, `${G.currentEvent.name} continues (round ${G.eventAge + 1} of ${dur})`, 'turn');
      } else {
        // Event expires — NOW it goes to discard (not when drawn). Flags clear.
        if (G.currentEvent) G.eventDiscard.push(G.currentEvent);
        G.eventFlags = {};
        G.currentEvent = null;
        G.eventAge = 0;

        // Draw fresh (round 2+)
        if (G.round >= 2) {
          if (!G.eventDeck.length) { G.eventDeck = [...G.eventDiscard]; G.eventDiscard = []; shuffle(G.eventDeck); }
          G.currentEvent = G.eventDeck.pop();
          log(G, `Event: ${G.currentEvent.name} — ${G.currentEvent.effect}`, 'turn');
          if (G.currentEvent.flag) G.eventFlags[G.currentEvent.flag] = true;
          if (G.currentEvent.resolve) G.currentEvent.resolve(G);
          // Royal Favor target
          if (G.eventFlags.royalFavor) {
            let minF = Infinity, targets = [];
            G.players.forEach(p => { if (!p.eliminated) { const f = calcFees(G, p); if (f < minF) { minF = f; targets = [p.id]; } else if (f === minF) targets.push(p.id); }});
            G.eventFlags.royalFavorTarget = targets[0]; // simplified: first tied
          }
          // Deal the card face-up — the UI shows it and holds the AI until acknowledged.
          effect(G, { type: 'event', name: G.currentEvent.name, effect: G.currentEvent.effect, cat: G.currentEvent.cat, round: G.round });
        }
      }
      G.phase = 'act';
      G.turn = G.firstPlayer;
      startPlayerTurn(G, G.players[G.turn]);
    } else {
      G.turn = next;
      startPlayerTurn(G, G.players[G.turn]);
    }
  }
}

function startPlayerTurn(g, p) {
  // Collect income at the start of YOUR turn (so humans have gold to buy during Act)
  const income = collectIncome(g, p);
  log(g, `${p.name}'s turn — collects ${income}g`, 'turn');
  effect(g, { type: 'income', player: p.id, gold: income });
  effect(g, { type: 'turn', player: p.id, round: g.round });
}

// ============================================================================
// UTILITIES
// ============================================================================

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

// ============================================================================
// EFFECT WRAPPERS — record what happened around the verbatim core functions
// ============================================================================

const qr = h => ({ q: h.q, r: h.r });
const unitInfo = u => u ? { type: u.type, owner: u.owner } : null;

function resolveCombat(attackerHex, defenderHex, isRanged = false) {
  const attacker = { ...qr(attackerHex), ...unitInfo(attackerHex.unit) };
  const defender = { ...qr(defenderHex), ...unitInfo(defenderHex.unit) };
  const result = resolveCombatCore(attackerHex, defenderHex, isRanged);
  effect(G, { type: 'combat', attacker, defender, result, ranged: isRanged, at: qr(defenderHex) });
  return result;
}

function executeBowmanAttack(from, target, targetType) {
  const before = target.unit ? { ...unitInfo(target.unit) } : null;
  const popBefore = target.holding ? currentPop(target) : null;
  executeBowmanAttackCore(from, target, targetType);
  effect(G, {
    type: 'ranged', from: qr(from), to: qr(target), targetType,
    killed: targetType === 'unit' && before && !target.unit,
    pop: target.holding ? currentPop(target) : null, popBefore,
  });
}

function executeMove(from, to, path = [], endsMove = true) {
  const unit = unitInfo(from.unit);
  const fromQR = qr(from), toQR = qr(to), pathQR = path.map(qr);
  executeMoveCore(from, to, path, endsMove);
  const arrived = to.unit && to.unit.owner === unit.owner && to.unit.type === unit.type && !from.unit;
  effect(G, { type: 'move', from: fromQR, to: toQR, path: pathQR, unit, arrived: !!arrived });
}

// ============================================================================
// PUBLIC API
// ============================================================================

function use(game) {
  if (!game) throw new Error('engine: no game');
  G = game;
  RNG = game._rng || null;
}
function begin(game) { use(game); game._effects = []; }
function result(game, extra) { return Object.assign({ ok: true, effects: game._effects }, extra || {}); }
function fail(game, why, extra) { return Object.assign({ ok: false, why, effects: game._effects || [] }, extra || {}); }

// Accept a hex object from game.hexes OR a {q, r}
function hexOf(game, h) {
  if (!h) return null;
  if (game.hexMap[hexKey(h.q, h.r)] === h) return h;
  return game.hexMap[hexKey(h.q, h.r)] || null;
}
function playerOf(game, p) { return typeof p === 'object' ? p : game.players[p]; }

function createGame(opts) {
  const rng = opts.seed != null ? mulberry32(opts.seed) : null;
  RNG = rng;
  const players = opts.players.map(c => ({ name: c.name, ai: !!c.ai, clientId: c.clientId || null }));
  const g = newGame(players, opts.difficulty || 'medium');
  // A seat with no name given is known by its house ("Marshal"), never by its colour. Houses are
  // dealt inside newGame, which has already logged the colour placeholders, so rename those too.
  g.players.forEach((p, i) => {
    if (opts.players[i].name) return;
    const was = p.name, now = p.house.name.replace(/^The /, '');
    p.name = now;
    const re = new RegExp(`\\b${was}\\b`, 'g');
    g.logEntries.forEach(e => { e.msg = e.msg.replace(re, now); });
  });
  if (rng) g._rng = rng;
  g._effects = [];
  return g;
}

function hydrateGame(json) {
  const g = hydrate(json);
  g._effects = [];
  return g;
}

// ---- queries ----------------------------------------------------------------

function currentPlayer(game) { return game.players[game.turn]; }
function phase(game) { return game.phase; }
function hexAt(game, q, r) { return game.hexMap[hexKey(q, r)] || null; }

function validCastleSites(game, playerId) { use(game); return castleSites(game, playerOf(game, playerId)); }

<script>

async function onHexTap(h) {
