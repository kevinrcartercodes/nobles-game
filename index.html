#seg-count button { flex: 1 1 0; min-width: 0; max-width: 56px; height: var(--btn-h); padding: 0; font-family: var(--body); font-size: var(--fs-ctl); font-weight: 700; border-radius: var(--r-md); }
.seats { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; touch-action: pan-y; min-height: 0; flex: 1; padding: 2px 2px 28px; -webkit-overflow-scrolling: touch; -webkit-mask-image: linear-gradient(180deg, #000 calc(100% - 34px), transparent 100%); mask-image: linear-gradient(180deg, #000 calc(100% - 34px), transparent 100%); }
.seats.fits { -webkit-mask-image: none; mask-image: none; padding-bottom: 2px; }
/* Same fade for any scrolling reference page, so a clipped row reads as 'more below'. */

.page-body.scroll.fits { -webkit-mask-image: none; mask-image: none; }
.seat { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; gap: 10px; min-height: var(--btn-h); height: auto; padding: 4px 4px 4px 14px; border-radius: var(--r-md); background: var(--paper); border: 1.5px solid var(--paper-edge); box-shadow: var(--shadow-chip); flex-shrink: 0; }
.seat .crest { width: 26px; height: 26px; }
.seat .crest svg { width: 100%; height: 100%; }
.seat .nm { font-family: var(--display); font-weight: 700; font-size: var(--fs-body); min-width: 0; white-space: nowrap; overflow: visible; }
.seat .toggle { display: flex; gap: 6px; }
.seat .toggle button { width: 88px; min-width: 0; height: calc(var(--btn-h) - 8px); padding: 0; border-radius: var(--r-md); background: var(--paper); border: 1.5px solid var(--paper-edge); color: var(--ink); font-family: var(--body); font-weight: 700; font-size: var(--fs-help); }
.seat .toggle button[aria-checked="true"] { background: var(--terracotta-2); color: var(--ivory); border-color: var(--terracotta-2); }
@container (max-width: 700px) { .newgame { gap: 8px 14px; } .seat { gap: 8px; padding-left: 8px; } .seat .toggle button { width: 78px; font-size: 15px; } #seg-count button { max-width: 48px; } .page-body { padding-top: 8px; padding-bottom: 8px; } .page-head { min-height: 60px; padding-top: 6px; padding-bottom: 6px; } }
/* strength slider: theme .slider visuals + a real range input on top for touch, keyboard and VoiceOver */
.slider input[type=range] { position: absolute; left: 0; right: 0; top: 0; height: 72px; width: 100%; margin: 0; opacity: 0; cursor: pointer; -webkit-appearance: none; appearance: none; }
.slider input[type=range]:focus-visible ~ .knob { outline: 3px solid var(--terracotta); outline-offset: 3px; }
.slider input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 72px; height: 72px; }
.slider .knob { pointer-events: none; }
.slider .stops { pointer-events: none; }
.slider .stops span { pointer-events: auto; cursor: pointer; padding: 16px; margin: -16px; }


/* how to play + houses */
.reader { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.lesson { display: grid; grid-template-columns: 96px 1fr; gap: 16px; align-items: start; background: var(--paper-2); color: var(--ink); border-radius: var(--r-md); padding: 16px; border: 1.5px solid var(--paper-edge); }

.legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
.legend div { display: flex; align-items: center; gap: 10px; background: var(--paper-2); border: 1.5px solid var(--paper-edge); border-radius: var(--r-md); padding: 8px 10px; font-size: var(--fs-cap); color: var(--ink); }
.legend div svg { width: 30px; height: 30px; flex: none; color: var(--umber); }
.house-row { display: grid; grid-template-columns: 36px 34px 1fr; gap: 10px; align-items: center; background: var(--paper-2); border: 1.5px solid var(--paper-edge); border-radius: var(--r-md); padding: 7px 12px; }
.house-row .crest { width: 34px; height: 34px; color: var(--umber); }
.house-row .crest svg { width: 100%; height: 100%; }
.house-row .nm { font-family: var(--display); font-weight: 700; font-size: calc(18px * var(--ts)); line-height: 1.2; }
.house-row .pk { color: var(--ink-2); font-size: calc(15px * var(--ts)); line-height: 1.25; }
/* The seat that holds this house, in its own colour, in line with the house name. */
.house-row .seat-of { width: 36px; display: grid; place-items: center; gap: 2px; }
.house-row .seat-of svg { width: 28px; height: 28px; }
.house-row .seat-of .tagme { font-family: var(--body); font-weight: 800; font-size: calc(10px * var(--ts)); line-height: 1; color: var(--ivory); background: var(--terracotta); border-radius: 4px; padding: 2px 4px; }
.house-row.idle { opacity: .62; }
.crest-strip { display: flex; gap: 14px; justify-content: center; margin-bottom: 4px; flex-wrap: wrap; }
.crest-strip div { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: var(--fs-lbl); color: var(--ink-2); font-family: var(--body); font-weight: 700; }
.crest-strip svg { width: 32px; height: 32px; }

/* ---------- title ---------- */
.title { position: absolute; inset: 0; grid-template-columns: 1.15fr 1fr; background: var(--paper); }
.title .art { position: relative; overflow: hidden; border-right: 1.5px solid var(--paper-edge); }
.title .art svg { position: absolute; inset: 0; width: 100%; height: 100%; }

.title .menu { display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 16px calc(28px + var(--sar)) 16px 30px; position: relative; }
.title h1 { font-family: var(--display); font-weight: 700; font-size: calc(50px * var(--ts)); letter-spacing: .06em; margin: 0; color: var(--ink); line-height: 1; text-transform: none; text-shadow: none; }
.title .rule { width: 80px; height: 2px; background: var(--gold); margin: 4px 0 2px; }
.title .tag { font-family: var(--body); font-weight: 500; font-size: var(--fs-body); color: var(--ink-2); margin: 0 0 4px; line-height: 1.3; }
.title .btn { justify-content: flex-start; font-family: var(--body); font-size: var(--fs-ctl); min-height: var(--btn-h); padding: 0 16px; white-space: nowrap; border-radius: var(--r-md); }
.title .primary { justify-content: center; font-family: var(--body); font-weight: 800; font-size: var(--fs-ctl); min-height: var(--btn-h); border-radius: var(--r-md); }
.title .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.title .row2 .btn { font-size: var(--fs-body); padding: 0 12px; gap: 8px; }
.title .fl { position: absolute; width: 120px; height: 120px; color: var(--gold-dark); opacity: .45; pointer-events: none; }
.title .fl.tr { right: 8px; top: 8px; transform: rotate(90deg); } .title .fl.br { right: 8px; bottom: 8px; transform: rotate(180deg); }
@container (max-height: 380px) { .title .menu { gap: 8px; } .title .btn { min-height: 46px; } .title .primary { min-height: 52px; } .title h1 { font-size: 38px; } .title .tag { display: none; } .title .rule { display: none; } }

/* ---------- play: the painted map ---------- */
.play { position: absolute; inset: 0; overflow: hidden; background: var(--map); }
.play .grain { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 90% 80% at 50% 45%, rgba(255,250,240,.55) 0%, rgba(235,223,198,0) 60%), linear-gradient(180deg, #EDE2CB, #E6D8BC); filter: url(#paper); }
.ornament { position: absolute; inset: 0; pointer-events: none; color: var(--umber); opacity: .28; z-index: 1; }
.ornament svg { position: absolute; width: 150px; height: 150px; }
.ornament .tl { left: -6px; top: -6px; } .ornament .tr { right: -6px; top: -6px; transform: rotate(90deg); } .ornament .br { right: -6px; bottom: -6px; transform: rotate(180deg); } .ornament .bl { left: -6px; bottom: -6px; transform: rotate(270deg); }
.board { position: absolute; inset: 0; touch-action: none; cursor: grab; overflow: hidden; }
.board svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
.board.dim #world { filter: saturate(.8); transition: filter 300ms; }
.board.grey #world { filter: saturate(.2) opacity(.7); transition: filter 900ms; }
.board.shake { animation: shake 120ms linear 1; }
@keyframes shake { 0% { transform: translate(0,0); } 25% { transform: translate(4px,-3px); } 50% { transform: translate(-4px,3px); } 75% { transform: translate(3px,2px); } 100% { transform: translate(0,0); } }
.unit { pointer-events: none; }
.unit.dead .uin { opacity: 0; transition: opacity 320ms var(--ease-out); }
.unit.selected .uin { animation: bob 1.6s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
#L-rings use, #L-rings polygon { transform-box: fill-box; transform-origin: center; }
@media (prefers-reduced-motion: no-preference) { .frame:not(.rm) #L-rings .pulse { animation: litPulse 1.5s ease-in-out infinite; } }
@keyframes litPulse { 0%, 100% { opacity: .78; } 50% { opacity: 1; } }
.frame:not(.rm) .canmove { animation: canMove 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes canMove { 0%, 100% { opacity: .55; transform: scale(.96); } 50% { opacity: 1; transform: scale(1.04); } }
.fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.fx .float { position: absolute; transform: translate(-50%, -50%); font-family: var(--body); font-weight: 800; font-size: var(--fs-caption); color: var(--ink); text-shadow: 0 0 6px var(--paper), 0 0 6px var(--paper), 0 1px 0 var(--paper); animation: floatUp 900ms var(--ease-out) forwards; white-space: nowrap; display: flex; align-items: center; gap: 4px; }
.fx .float .ico { width: 22px; height: 22px; }
.fx .float.dmg { color: var(--rose); } .fx .float.heal { color: var(--verdigris); } .fx .float.gold { color: var(--h-gilt-text); }
@keyframes floatUp { 0% { opacity: 0; translate: 0 6px; } 15% { opacity: 1; } 100% { opacity: 0; translate: 0 -30px; } }
.fx .pip { position: absolute; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; border: 3px solid var(--rose); opacity: 0; animation: pip 420ms var(--ease-out) forwards; }
@keyframes pip { 0% { transform: scale(.4); opacity: .9; } 100% { transform: scale(1.4); opacity: 0; } }

/* ---------- HUD (paper chips from theme.css; only positions live here) ---------- */
.hud { position: absolute; z-index: 5; }
:root, .frame { --cl: max(8px, calc(.45 * var(--sal))); --cr: max(8px, calc(.45 * var(--sar))); }
#hud-menu { left: var(--cl); top: 8px; }
#hud-gold { left: calc(var(--cl) + var(--chip-h) + 8px); top: 8px; }
#hud-round { right: var(--cr); top: 8px; }
.frame.lefty #hud-menu { left: auto; right: var(--cr); }
.frame.lefty #hud-gold { left: auto; right: calc(var(--cr) + var(--chip-h) + 8px); }
.frame.lefty #hud-round { right: auto; left: var(--cl); }
.chip .ev { max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
.chip .rd { font-family: var(--body); font-weight: 800; font-size: var(--fs-num); }
@container (max-width: 700px) { .chip .ev:not(:has(b)) { display: none; } #hud-ev-name { display: none; } .crests.many .crest-disc { width: 40px; height: 40px; } .crests.many { gap: 16px; } }
.crests { left: 50%; top: 8px; transform: translateX(-50%); display: flex; gap: 18px; align-items: center; height: calc(var(--chip-h) + 6px); }
.crests .crest-disc { margin-top: 5px; }
.race { left: var(--cl); top: auto; bottom: calc(2px + var(--sab) + var(--fs-cap) + 6px); transform: none; display: grid; grid-template-rows: 1fr 1fr; gap: 4px; width: max-content; min-width: 138px; height: auto; padding: 7px 9px; border-radius: 14px; background: rgba(246,240,228,.94); border: 1.5px solid var(--paper-edge); box-shadow: var(--shadow-chip); color: var(--ink); text-align: left; }
.race .r { display: grid; grid-template-columns: 24px 1fr auto; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; white-space: nowrap; min-width: 0; }
.race .r .c { width: 24px; height: 24px; }
.race .r .n { display: none; }
.race .lbl { position: absolute; bottom: calc(100% - 11px); left: 50%; transform: translateX(-50%); font-family: var(--body); font-weight: 700; font-size: var(--fs-lbl); letter-spacing: .06em; color: var(--ink); white-space: nowrap; background: rgba(246,240,228,.94); border: 1.5px solid var(--paper-edge); padding: 2px 10px; border-radius: var(--r-pill); }
.race .r { position: relative; }
.race .r .bar { height: 9px; min-width: 24px; border-radius: 4px; background: var(--paper-3); position: relative; overflow: hidden; min-width: 40px; }
.race .r .bar::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: var(--v); background: var(--c); border-radius: 4px; }
.race .r .v { font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: calc(14px * var(--ts)); font-weight: 800; }
.race .r.threat .v, .race .r.threat .n { color: var(--rose); }

@container (max-width: 700px) { .race { width: max-content; min-width: 120px; padding: 5px 7px; } .race .r .v { font-size: 12px; } .race .lbl { display: none; } }
.crest-disc:active { transform: scale(.94); }
.toast { top: calc(var(--chip-h) + 24px); max-width: 72%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; pointer-events: none; }
.caption { left: 50%; bottom: calc(8px + var(--sab) + 8px); max-width: calc(100% - var(--end) * 2 - var(--sal) - var(--sar) - 40px); white-space: normal; text-align: center; line-height: 1.25; transform: translateX(-50%); padding: 10px 20px; border-radius: var(--r-pill); background: rgba(246,240,228,.94); border: 1.5px solid var(--paper-edge); box-shadow: var(--shadow-chip); font-size: calc(18px * var(--ts)); font-weight: 700; color: var(--ink); pointer-events: none; }
.caption .ico { width: 24px; height: 24px; color: var(--umber); vertical-align: -6px; margin: 0 2px; }
.caption b { color: var(--terracotta-2); }
/* End Turn (terracotta, theme) and Build (paper) in the thumb corners; re-centre above Build */
.endturn { right: var(--cr); bottom: calc(2px + var(--sab) + var(--fs-cap) + 6px); }
.endturn .lbl { background: rgba(246,240,228,.94); border: 1.5px solid var(--paper-edge); padding: 2px 10px; border-radius: var(--r-pill); font-family: var(--body); font-size: var(--fs-lbl); letter-spacing: .06em; }
.endturn.stamp { animation: stamp 260ms var(--ease-out); }
@keyframes stamp { 0% { transform: scale(1); } 40% { transform: scale(.9); } 100% { transform: scale(1); } }
.build { left: var(--cl); top: 50%; transform: translateY(-50%); width: var(--end); height: var(--end); border-radius: 50%; background: var(--paper); border: 2px solid var(--paper-edge); box-shadow: var(--shadow-chip); display: flex; align-items: center; justify-content: center; color: var(--umber); transition: transform var(--t-fast); }
.build svg { width: 50%; height: 50%; }
.build:active { transform: scale(.94); background: var(--paper-2); }
.build[disabled] { opacity: .5; }
.build .badge { position: absolute; top: -4px; right: -4px; min-width: 30px; height: 30px; padding: 0 8px; border-radius: 15px; background: var(--ochre); border: 3px solid var(--ivory); color: var(--ink); font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.frame.setup #hud-round .lbl { display: none; }
#hud-round .lbl { position: absolute; top: calc(100% + 2px); left: 50%; transform: translateX(-50%); font-family: var(--body); font-weight: 700; font-size: var(--fs-lbl); letter-spacing: .06em; color: var(--ink); white-space: nowrap; background: rgba(246,240,228,.94); border: 1.5px solid var(--paper-edge); padding: 2px 10px; border-radius: var(--r-pill); }
.build .lbl { position: absolute; bottom: calc(-1 * var(--fs-cap) - 6px); left: 50%; transform: translateX(-50%); font-family: var(--body); font-weight: 700; font-size: var(--fs-lbl); letter-spacing: .06em; color: var(--ink); white-space: nowrap; background: rgba(246,240,228,.94); border: 1.5px solid var(--paper-edge); padding: 2px 10px; border-radius: var(--r-pill); }
#hud-recentre { left: var(--cl); top: calc(50% - var(--end) - 18px); transform: translateY(-50%); }
.frame.lefty .build { left: auto; right: var(--cr); }
.frame.lefty #hud-recentre { left: auto; right: var(--cr); }
.frame.lefty .endturn { right: auto; left: var(--cl); }
@container (max-width: 700px) { .endturn { bottom: calc(8px + var(--sab)); } .endturn .lbl, .build .lbl { display: none; } }
/* action bar: theme sizes; app adds the bottom offset and pending states */
.actionbar { pointer-events: none; bottom: calc(8px + var(--sab)); gap: 8px; max-width: calc(100% - var(--end) * 2 - var(--sal) - var(--sar) - 40px); animation: rise 160ms var(--ease-out); }
.actionbar .row > * { pointer-events: auto; }
.actionbar .cap { white-space: normal; text-align: center; max-width: 100%; line-height: 1.25; font-size: calc(18px * var(--ts)); }
@keyframes rise { 0% { transform: translate(-50%, 18px); opacity: 0; } 100% { transform: translate(-50%, 0); opacity: 1; } }
.actionbar .cap.short { color: var(--rose); }
.act.hot { border-color: var(--terracotta-2); background: var(--terracotta); color: var(--ivory); }
.act:focus-visible { outline: 3px solid var(--terracotta); outline-offset: 3px; }

/* turn ribbon */
.ribbon { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); width: min(440px, 70%); height: 88px; z-index: 8; display: grid; place-items: center; pointer-events: none; color: var(--rc, var(--terracotta)); animation: ribbonIn 900ms var(--ease-out) forwards; }
.ribbon .rb { position: absolute; inset: 0; width: 100%; height: 100%; }
.ribbon .cr { position: absolute; left: 48px; top: 50%; width: 34px; height: 34px; transform: translateY(-50%); color: var(--ivory); }
.ribbon span { position: relative; font-family: var(--display); font-weight: 700; font-size: calc(24px * var(--ts)); letter-spacing: .06em; color: var(--ivory); text-shadow: 0 1px 0 rgba(0,0,0,.35); padding-left: 24px; }
@keyframes ribbonIn { 0% { transform: translate(-50%, -30px) scale(.9); opacity: 0; } 18% { transform: translate(-50%, 0) scale(1); opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }

/* ---------- bottom sheet (theme .sheet + app behaviour) ---------- */
.sheet-veil { position: absolute; inset: 0; z-index: 9; background: rgba(46,36,28,.18); }
.bsheet { left: calc(12px + var(--sal)); right: calc(12px + var(--sar)); height: auto; min-height: 40%; max-height: calc(100% - 20px); z-index: 10; display: grid; grid-template-rows: auto 1fr; transition: transform 220ms var(--ease-out); touch-action: none; padding-bottom: 0; }
.bsheet.full { min-height: calc(100% - 64px); }
.bsheet.enter { animation: sheetIn 220ms var(--ease-out); }
@keyframes sheetIn { 0% { transform: translateY(40%); } 100% { transform: translateY(0); } }
.bs-body { min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 10px; padding-bottom: calc(12px + var(--sab)); touch-action: pan-y; }
.bs-body > * { flex-shrink: 0; }
.bs-body h2 { margin: 0; font-size: var(--fs-t); }
.bs-body h2 svg { width: 34px; height: 34px; }
.bs-body p { margin: 0; font-size: var(--fs-body); color: var(--ink-2); line-height: 1.4; }
.bs-body p b { color: var(--ink); }
.icard { display: flex; flex-direction: column; gap: 0; }
.icard + .icard { border-top: 1.5px solid var(--paper-edge); padding-top: 10px; }
.icard h2 { margin-bottom: 4px; }
.icard p { margin: 8px 0 4px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 40px; }
@container (max-width: 700px) { .cols { grid-template-columns: 1fr; gap: 0; } }
.row-i .v .walls { justify-content: flex-end; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 14px; }
.kv div { display: flex; flex-direction: column; gap: 2px; }
.kv .k { font-family: var(--display); font-weight: 700; font-size: var(--fs-cap); letter-spacing: .06em; color: var(--ink-2); text-transform: uppercase; }
.kv .v { font-size: var(--fs-num); font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; }
.kv .v.danger { color: var(--rose); }
.lb { display: grid; grid-template-columns: 30px minmax(150px, 186px) 50px 1fr 1fr 1fr; gap: 4px 12px; align-items: center; font-size: var(--fs-body); }
.lb .n { font-family: var(--body); font-weight: 700; font-size: calc(15px * var(--ts)); line-height: 1.15; }
.lb .g { font-weight: 800; font-size: calc(19px * var(--ts)); font-variant-numeric: tabular-nums; }
.lb .m { display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; min-width: 0; }
.lb .m i { display: block; flex: 1; height: 8px; border-radius: 5px; background: var(--paper-3); position: relative; overflow: hidden; }
.lb .m i::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: var(--v); background: var(--c); border-radius: 5px; }
.lb .m b { font-size: calc(15px * var(--ts)); font-weight: 800; min-width: 44px; text-align: right; }
.lb .h { font-family: var(--body); font-weight: 700; font-size: calc(12px * var(--ts)); letter-spacing: .04em; color: var(--ink-2); text-transform: none; }
/* A blocked row that offers a next step is an action, not a dead end. */
.card.event .art.house { background: var(--paper-2); display: grid; place-items: center; padding: 10%; }
/* The verdict, said plainly, before the heraldry. */
.vbanner { grid-column: 1 / -1; justify-self: center; margin: -6px 0 2px; padding: 6px 28px; border-radius: var(--r-pill); font-family: var(--display); font-weight: 700; font-size: calc(26px * var(--ts)); line-height: 1.1; letter-spacing: .01em; color: var(--ivory); background: var(--terracotta); box-shadow: 0 3px 0 var(--terracotta-2); }
.vbanner.lose { background: var(--umber); box-shadow: 0 3px 0 #4A3527; }
.brow.alt { border-color: var(--terracotta); }
.brow.alt .s { color: var(--terracotta-2); font-weight: 700; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sheet-head h2 { margin: 0 !important; }
.sheet-head .btn { min-height: 44px; padding: 0 18px; flex: none; }
.bs-body .lb { row-gap: 6px; }
.bs-body .lb .n { font-size: calc(18px * var(--ts)); white-space: nowrap; }
.bs-body .lb .g { font-size: calc(22px * var(--ts)); }
.bs-body .lb .m b { font-size: calc(17px * var(--ts)); min-width: 52px; }
.bs-body .lb .m i { height: 10px; }
.bs-body .lb svg { width: 30px; height: 30px; }
.bs-body .lb .h { font-size: calc(13px * var(--ts)); }
#bs-body h2 { margin: 0 0 4px; font-size: calc(24px * var(--ts)); }
/* Close must always be reachable: it rides the bottom of the sheet, outside the scroll. */
.bs-body:has(.sheet-actions) { padding-bottom: 0; }
.bs-body .sheet-actions { position: sticky; bottom: 0; margin-top: auto; padding: 8px 0 calc(4px + var(--sab)); background: linear-gradient(to top, var(--paper) 70%, rgba(246,240,228,0)); }
.lb svg { width: 26px; height: 26px; }
.lb .row-active { color: var(--terracotta-2); }
@container (max-width: 700px) { .lb { grid-template-columns: 28px 76px 40px 1fr 1fr 1fr; gap: 4px 6px; } .lb .h { font-size: 12px !important; letter-spacing: .02em !important; } .lb .m b { min-width: 38px; font-size: 14px; } .lb .n { font-size: 16px; } .settings { grid-template-columns: 1fr; } }
.menu-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.menu-list .btn { justify-content: flex-start; }
.menu-list .btn { min-height: var(--btn-h); font-family: var(--body); font-size: var(--fs-ctl); font-weight: 700; border-radius: var(--r-md); }
.menu-list .btn.gold { background: var(--terracotta); color: var(--ivory); border-color: var(--terracotta-2); font-weight: 800; }
.menu-list .btn.gold .ico { color: var(--ivory); }
.settings { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; }
.setting { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: var(--fs-body); font-weight: 700; color: var(--ink); min-height: 48px; flex-wrap: wrap; }
.setting > span .ico { width: 24px; height: 24px; color: var(--umber); vertical-align: -5px; margin-right: 4px; }
.setting { font-family: var(--body); font-size: var(--fs-body); }
.setting .seg button { min-width: 48px; height: 48px; padding: 0 14px; font-size: var(--fs-help); box-shadow: none; }
.log-body { overflow-y: auto; touch-action: pan-y; font-size: var(--fs-body); color: var(--ink-2); min-height: 0; }
.log-body div { padding: 4px 0; border-bottom: 1px solid var(--paper-3); }
.log-body .turn { color: var(--ink); font-weight: 800; }
.log-body .lh { font-family: var(--body); font-weight: 800; font-size: var(--fs-ctl); color: var(--ink); padding: 10px 0 4px; }
.log-body .lc { width: 18px; height: 18px; vertical-align: -3px; margin-right: 4px; }
.log-body .combat { color: var(--rose); } .log-body .build { color: var(--verdigris); }
.sheet-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: auto; padding-top: 6px; }
.sheet-actions .btn { min-height: var(--btn-h); font-family: var(--body); font-size: var(--fs-ctl); font-weight: 700; border-radius: var(--r-md); }
.sheet-actions .btn.gold { background: var(--terracotta); color: var(--ivory); border-color: var(--terracotta-2); font-weight: 800; }
.ev-inline { display: flex; align-items: center; gap: 12px; background: var(--paper-2); border: 1.5px solid var(--paper-edge); border-radius: var(--r-md); padding: 10px 14px; font-size: var(--fs-body); color: var(--ink); text-align: left; }
.ev-inline .ico { width: 28px; height: 28px; color: var(--umber); flex: none; }
.brow { display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 14px; min-height: 64px; padding: 6px 14px; border-radius: var(--r-md); background: var(--paper-2); border: 1.5px solid var(--paper-edge); color: var(--ink); text-align: left; font-size: var(--fs-body); }
.brow:active { background: var(--paper-3); }
.brow .ico { width: 44px; height: 44px; }
.brow .t { font-weight: 800; font-size: var(--fs-ctl); }
.brow .s { font-size: var(--fs-help); color: var(--ink-2); }
.brow .c { font-weight: 800; font-size: var(--fs-num); white-space: nowrap; text-align: right; }
.brow .c .ico { width: 24px; height: 24px; color: var(--ochre); vertical-align: -5px; }
.brow.off { background: var(--paper-3); }
.brow.off .ico, .brow.off .c { opacity: .55; }
.brow.off .t { color: var(--ink-2); }
.brow.off .s { color: #A03A4E; }
.blist { display: flex; flex-direction: column; gap: 8px; }

/* ---------- spotlight onboarding ---------- */
.spot { position: absolute; inset: 0; z-index: 14; }
.spot svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.spot .callout { pointer-events: none; line-height: 1.3; }
.spot .callout::after { content: ""; position: absolute; border: 12px solid transparent; }
.spot .callout.below::after { top: -12px; left: 28px; border-top: 0; border-bottom-color: var(--paper); }
.spot .callout.above::after { bottom: -12px; left: 28px; border-bottom: 0; border-top-color: var(--paper); }
.spot .skip { pointer-events: auto; position: absolute; right: calc(12px + var(--sar)); top: 12px; min-height: 48px; padding: 0 18px; border-radius: var(--r-md); background: var(--paper); border: 1.5px solid var(--paper-edge); box-shadow: var(--shadow-chip); font-size: var(--fs-cap); font-weight: 700; color: var(--ink-2); }
.spot .next { pointer-events: auto; position: absolute; left: 50%; bottom: calc(16px + var(--sab)); transform: translateX(-50%); min-height: var(--btn-h); padding: 0 26px; border-radius: var(--r-md); background: var(--terracotta); color: var(--ivory); font-family: var(--body); font-weight: 800; font-size: var(--fs-ctl); box-shadow: 0 3px 0 var(--terracotta-2); }
.spot.tap-through .next { display: none; }
.frame.lefty .spot .skip { right: auto; left: calc(12px + var(--sal)); }

/* ---------- overlays (theme .veil / .card) ---------- */
.veil { z-index: 20; }
.veil.soft { background: rgba(46,36,28,.5); }
.veil.opaque { background: var(--paper); }
.card .corner { position: absolute; width: 56px; height: 56px; color: var(--gold-dark); opacity: .55; pointer-events: none; }
.card.event { width: 78%; height: 84%; max-width: 820px; display: grid; grid-template-columns: 40% 1fr; padding: 0; animation: cardUp var(--t-card) var(--ease-out); }
.card.event .art { height: 100%; border-bottom: 0; border-right: 1.5px solid var(--paper-edge); background: var(--paper-2); display: grid; place-items: center; overflow: hidden; }
.card.event .art svg { width: 100%; height: 100%; display: block; }
.card.event .art .ico { width: 96px; height: 96px; color: var(--umber); }
.card.event .body { display: flex; flex-direction: column; gap: 4px; min-height: 0; padding: 16px 24px; }
.card.event .catpill { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: var(--r-md); background: var(--paper-2); border: 1.5px solid var(--paper-edge); }
.card.event .catpill .ico { width: 22px; height: 22px; color: var(--umber); }
.card.event h3 { font-size: var(--fs-t); margin: 4px 0 4px; }
.card.event p { font-size: var(--fs-card-p); flex: 1; min-height: 0; overflow: auto; }
.card.event .actions { margin-top: 8px; }
.card.event .actions .primary { width: 100%; min-height: var(--btn-h); border-radius: var(--r-md); font-family: var(--body); font-weight: 800; font-size: var(--fs-ctl); }
@keyframes cardUp { 0% { transform: translateY(40px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
@container (max-height: 400px) { .card.event .body { padding: 10px 16px; } .card.event h3 { font-size: calc(28px * var(--ts)); } .card.event p { font-size: calc(19px * var(--ts)); } .card.event .actions .primary { min-height: 50px; } }
.handoff { display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; padding: 24px; color: var(--ink); }
.handoff .crest { width: 110px; height: 110px; }
.handoff .crest svg { width: 100%; height: 100%; }
.handoff h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: var(--fs-t); color: var(--ink); }
.handoff p { margin: 0; color: var(--ink-2); font-size: var(--fs-body); font-family: var(--body); }
.handoff .primary { min-height: var(--btn-h); border-radius: var(--r-md); font-family: var(--body); font-weight: 800; font-size: var(--fs-ctl); }
.victory { display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: center; padding: 24px 32px; max-width: min(92%, 600px); position: relative; z-index: 2; animation: victoryIn 900ms var(--ease-out) 500ms both; }
@keyframes victoryIn { 0% { transform: scale(1.25); opacity: 0; } 40% { opacity: 1; } 100% { transform: scale(1); } }
.victory .seal { width: 128px; height: 128px; position: relative; display: grid; place-items: center; animation: sealStamp 500ms var(--ease-out) 700ms both; }
@keyframes sealStamp { 0% { transform: scale(2.2); opacity: 0; } 60% { transform: scale(.94); opacity: 1; } 100% { transform: scale(1); } }
.victory .seal svg.s { position: absolute; inset: 0; width: 100%; height: 100%; }
.victory .seal svg.c { width: 54px; height: 54px; position: relative; color: var(--ivory); }
.victory h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: var(--fs-t); letter-spacing: .02em; }
.victory .btn, .victory .primary { min-height: var(--btn-h); border-radius: var(--r-md); font-family: var(--body); font-size: var(--fs-ctl); font-weight: 700; }
.victory p { margin: 4px 0 0; color: var(--ink-2); font-size: var(--fs-body); }
.victory .actions { grid-column: 1 / -1; display: flex; gap: 10px; justify-content: flex-end; }
.vburst { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
.vburst i { position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; color: var(--ochre); animation: burst 1400ms var(--ease-out) forwards; }
.vburst i svg { width: 100%; height: 100%; }
@keyframes burst { 0% { transform: translate(0,0) scale(.4); opacity: 0; } 10% { opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(1) rotate(200deg); opacity: 0; } }
.frame.rm .card.event, .frame.rm .victory, .frame.rm .victory .seal, .frame.rm .ribbon, .frame.rm .actionbar, .frame.rm .bsheet.enter, .frame.rm .board.shake { animation: none; }
@media (prefers-reduced-motion: reduce) { .card.event, .victory, .victory .seal, .ribbon, .actionbar, .bsheet.enter, .board.shake { animation: none; } }
@media (hover: hover) {
  .btn:hover, .brow:hover { background: var(--paper-2); }
  .act:hover, .chip:hover { border-color: var(--umber); }
  .endturn:not([disabled]):hover, .primary:hover { filter: brightness(1.05); }
}
@media (orientation: portrait) { .play { display: none !important; } }

/* SE: settings stack in one column */
@container (max-width: 700px) { .settings { grid-template-columns: 1fr; } }

/* Turn order in the crest row. The house moving now gets its colour behind the crest and a pointer
   under it; houses that have moved this round fade back. No change of height: that knocks the row out of line. */
.crests .crest-disc { transition: background-color var(--t-fast) var(--ease-out); }
.crests .crest-disc svg { transition: opacity var(--t-fast) var(--ease-out); }
.crests .crest-disc.active { background: color-mix(in srgb, currentColor 22%, var(--paper)); border: 3px solid currentColor; }
.crests .crest-disc.active::after { content: ""; position: absolute; left: 50%; bottom: -21px; transform: translateX(-50%); border: 7px solid transparent; border-top: 8px solid var(--terracotta); }
/* fade the crest and ring, not the disc: a see-through disc showed the board's units through it */
.crests .crest-disc.done svg { opacity: .35; }
.crests .crest-disc.done { background: var(--paper-2, var(--paper)); }

/* Web build only: the link to the classic page, which still has online multiplayer.
   The app build leaves the marker empty, so this rule matches nothing there. */
.title a.btn.online { width: 100%; margin-top: 10px; text-decoration: none; color: inherit; }

</style>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true" id="nobles-sprites">
  <!--
    Nobles Mobile sprite library, v3: a painted map on paper (docs/design-system-v3.md).
    Hex geometry: POINTY-TOP, viewBox 0 0 100 100, centre (50,50), circumradius 50.
      points="50,0 93.3,25 93.3,75 50,100 6.7,75 6.7,25"
    For a board hex of size R: px = R*1.732*(q + r/2), py = R*1.5*r; scale the symbol by R/50.

  -->
  <defs>

      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.28  0 0 0 0 0.2  0 0 0 0.07 0" result="g"/>

      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.3  0 0 0 0 0.22  0 0 0 0 0.12  0 0 0 0.06 0" result="g"/>
      <feComposite in="g" in2="SourceGraphic" operator="in" result="gi"/>

    <!-- watercolour pooling: lighter centre, pigment gathers at the rim -->
    <radialGradient id="pool" cx="50%" cy="46%" r="60%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>

    <radialGradient id="ice-sheen" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.6"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>

    <linearGradient id="wax" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C8566B"/><stop offset="1" stop-color="#9E3A46"/></linearGradient>
  </defs>

  <symbol id="hex-shape" viewBox="0 0 100 100"><polygon points="50,0 93.3,25 93.3,75 50,100 6.7,75 6.7,25"/></symbol>

  <symbol id="hex-lake" viewBox="0 0 100 100">

      <rect width="100" height="100" fill="url(#water)"/><rect width="100" height="100" fill="url(#pool)"/>
      <path d="M14 40 q10 -6 20 0 q10 6 20 0" fill="none" stroke="#DCEAF7" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
      <path d="M40 64 q10 -6 20 0 q10 6 20 0" fill="none" stroke="#DCEAF7" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
      <path d="M18 84 q10 -6 20 0" fill="none" stroke="#DCEAF7" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
      <path d="M62 24 q8 -5 16 0" fill="none" stroke="#DCEAF7" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    </g>
  </symbol>

  <symbol id="hex-ice" viewBox="0 0 100 100">
    <g clip-path="url(#hexclip)" filter="url(#grain)">
      <rect width="100" height="100" fill="#DDE9EF"/><rect width="100" height="100" fill="url(#ice-sheen)"/><rect width="100" height="100" fill="url(#pool)"/>

<script>
/*
 * Nobles — rules engine. Extracted verbatim from the browser game
 * (~/code/nobles-game/index.html, v1.1) by tools/extract-engine.js.
 * No DOM, no network, no timers. Same rules, same AI, same log text.
 *
 * Loads as a classic <script> (window.NoblesEngine), a CommonJS module
 * (module.exports) or via a bundler. See PLAN.md for the API contract.
 */
(function (root) {
'use strict';

// Module-level "current game". The original code addressed a global G;
// every public API call points G at the game it was handed first.
let G = null;

// Randomness goes through rand() so a seeded game is reproducible and
// tests can swap the source. Default reads Math.random at CALL time.
let RNG = null;
function rand() { return RNG ? RNG() : Math.random(); }
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;

    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

}

// Effects are what the UI animates from. Every command starts a fresh list.
function effect(g, e) { if (g) (g._effects || (g._effects = [])).push(e); }

// The chronicle. Same entries as the original log(); also an effect.
function log(g, msg, cls = null) {
  g.logEntries.push({ msg, cls });
  effect(g, { type: 'log', msg, cls });
}


// ============================================================================
// CONSTANTS & DATA, HEX MATH
// ============================================================================

const COLORS = ['#e03131', '#1c7ed6', '#2f9e44', '#f59f00', '#9c36b5', '#f1ede4'];
const COLOR_NAMES = ['Crimson', 'Azure', 'Verdant', 'Gold', 'Violet', 'Ivory'];

const UNIT_TYPES = {
  spearman: { move: 1, cost: 20, icon: '▲', beats: 'knight' },
  bowman:   { move: 1, cost: 25, icon: '●', beats: 'spearman' },
  knight:   { move: 2, cost: 30, icon: '◆', beats: 'bowman' }
};

const HOLDING_TYPES = {
  castle:  { pop: 5, cost: null },
  village: { pop: 3, cost: 20 },   // upgrade from outpost
  outpost: { pop: 1, cost: 20 }
};

// Three roads to the crown:
//   Population 15  — build villages, grow the realm
//   Income 36      — fiefs + population per turn (the sprawl route)
//   Conquest       — capture ANY enemy castle. Instant win.
// The old "Army 8" condition was a turtle path: park eight spearmen on your
// holdings (0 supply) and wait. Sims showed it almost never raced the others
// and it rewarded not interacting. Conquest replaces it with the opposite —
// a path that only works by going after someone.
// Income 36: sims split Population/Income ~50/50 at 3–4 players (40 was 96/4, 35 was 37/64).
// Two players share a smaller board with no contested middle, so there is less land to tax:
// at 36 income almost never won (14%); 34 splits ~60/37 with six fights a game (33 was 41/56).
const WIN_BASE = { pop: 15, income: 36 };
const WIN_BY_PLAYERS = { 2: { pop: 15, income: 34 } };
const winFor = n => WIN_BY_PLAYERS[n] || WIN_BASE;
const WIN = {
  get pop()    { return winFor(G && G.players ? G.players.length : 0).pop; },
  get income() { return winFor(G && G.players ? G.players.length : 0).income; },
};
const STARTING_GOLD = 15;
const COMPONENT_LIMITS = { outpost: 15, village: 10 };

const HOUSES = [
  { key: 'architect',     name: 'The Architect',     icon: '🏘️', power: 'Village upgrade 15g (−5)' },
  { key: 'castellan',     name: 'The Castellan',     icon: '🏕️', power: 'Outposts cost 15g (−5)' },
  { key: 'chancellor',    name: 'The Chancellor',    icon: '💰', power: '+2g every Upkeep' },
  { key: 'surveyor',      name: 'The Surveyor',      icon: '🗺️', power: '+1g per unclaimed tile conquered' },
  { key: 'marshal',       name: 'The Marshal',       icon: '⚔️', power: 'Start with 2 Spearmen' },
  { key: 'quartermaster', name: 'The Quartermaster', icon: '📦', power: 'Supply traces through enemy fiefs' }
];

// Catch-up cards: who is "lowest"? The metric first, then lowest income, and
// only a dead heat on both shares the card. Before, a 4-way tie in round 2
// handed the bonus to everyone, which is no catch-up at all.
function lowestBy(g, metric) {
  let targets = [];
  g.players.forEach(p => {
    if (p.eliminated) return;
    const k = [metric(p), calcFees(g, p)];
    if (!targets.length) { targets = [p]; targets.key = k; return; }
    const b = targets.key;
    if (k[0] < b[0] || (k[0] === b[0] && k[1] < b[1])) { targets = [p]; targets.key = k; }
    else if (k[0] === b[0] && k[1] === b[1]) targets.push(p);
  });
  return targets;
}

const EVENTS = [
  { name: 'Plague', cat: 'brake', effect: 'Highest-pop player loses 1 pop from their top holding',
    resolve: (g) => {
      let maxPop = -1, targets = [];

      targets.forEach(p => {
        let best = null, bp = -1;
        g.hexes.forEach(h => { if (h.holding && h.holding.owner === p.id) { const cp = currentPop(h); if (cp > bp) { bp = cp; best = h; }}});
        if (best && bp > 0) { best.holding.damage = Math.min(best.holding.damage + 1, HOLDING_TYPES[best.holding.type].pop); log(g, `Plague strikes ${p.name}'s ${best.holding.type}`, 'combat'); }

      });

        const victim = aiPickDisbandVictim(g, p, units); // furthest-from-home unit, same rule for everyone
        victim.unit = null;
        log(g, `Banditry: ${p.name} loses a ${victim._lastUnitType || 'unit'}`, 'combat');
      });
    }},
  { name: 'Uprising', cat: 'brake', effect: 'Outposts produce no pop income this round', flag: 'uprising' },
  { name: 'Tax Revolt', cat: 'brake', effect: 'Highest income collects only half this round', flag: 'taxRevolt' },
  { name: 'Caravan', cat: 'catchup', effect: 'Fewest fiefs gets +5g (ties: lowest income)',
    resolve: (g) => {
      const targets = lowestBy(g, p => countFiefs(g, p.id));
      targets.forEach(p => { p.gold += 5; log(g, `Caravan: ${p.name} +5g`, 'build'); });
    }},
  { name: 'Recruitment Drive', cat: 'catchup', effect: 'Fewest units gets a free Spearman (ties: lowest income)',
    resolve: (g) => {
      // Was: everyone tied → everyone gets one (a wash), and nobody if the
      // castle hex was occupied. Now: real tie-break, and any free holding.
      const targets = lowestBy(g, p => countUnits(g, p.id));
      targets.forEach(p => {

          .map(t => g.hexes.find(h => h.holding && h.holding.type === t && h.holding.owner === p.id && !h.unit))
          .find(Boolean);
        if (spot) { spot.unit = { type: 'spearman', owner: p.id, moved: true, attacked: true }; log(g, `Recruitment: ${p.name} gains a Spearman at their ${spot.holding.type}`, 'build'); }
        else log(g, `Recruitment: ${p.name} has no free holding for the Spearman`);
      });
    }},
  { name: 'Royal Favor', cat: 'catchup', effect: 'Lowest income gets −15g on one holding', flag: 'royalFavor' },
  { name: 'Tithe', cat: 'catchup', effect: 'Each player gives 1g to the poorest',
    resolve: (g) => {
      const alive = g.players.filter(p => !p.eliminated);
      let min = Infinity, poorest = [];
      alive.forEach(p => { if (p.gold < min) { min = p.gold; poorest = [p]; } else if (p.gold === min) poorest.push(p); });
      const givers = alive.filter(p => !poorest.includes(p));
      const pot = givers.length;
      givers.forEach(p => p.gold -= 1);
      const share = Math.floor(pot / poorest.length);
      poorest.forEach(p => p.gold += share);
      log(g, `Tithe: ${poorest.map(p=>p.name).join(', ')} ${poorest.length === 1 ? 'receives' : 'each receive'} ${share}g`);
    }},
  { name: 'Winter', cat: 'tempo', duration: 2, effect: 'Lakes freeze — walk across them and end your turn on the ice. Ice is a road, not land (no fief, no tax). Supply traces through it. Rivers also freeze. LASTS TWO ROUNDS — when it thaws, anything supplied only through ice is cut off.', flag: 'winter' },
  // Fog / Clear Skies / Royal Envoy retired: a bowman was on the board in under 5% of draws and
  // Envoy does nothing offline. Kept in EVENTS so saved games index correctly.
  { name: 'Fog', cat: 'tempo', effect: 'No Bowman ranged attacks', flag: 'fog', retired: true },
  { name: 'Mud Season', cat: 'tempo', effect: 'All movement capped at 1', flag: 'mud' },
  { name: 'Clear Skies', cat: 'tempo', effect: 'Bowmen ranged attack at range 2', flag: 'clearSkies', retired: true },
  { name: 'Forced March', cat: 'tempo', effect: '+1 movement for all, and forests no longer stop a move', flag: 'forcedMarch' },
  { name: 'Peace Treaty', cat: 'tempo', effect: 'No combat or siege this round', flag: 'peace' },
  { name: 'Bumper Harvest', cat: 'accel', effect: '+3g to all',
    resolve: (g) => { g.players.forEach(p => { if (!p.eliminated) p.gold += 3; }); log(g, 'Bumper Harvest: all +3g', 'build'); }},
  { name: 'Market Day', cat: 'accel', effect: 'Units −5g (min 5)', flag: 'marketDay' },
  { name: 'Building Boom', cat: 'accel', effect: 'Holdings −10g (min 10)', flag: 'buildingBoom' },
  // Retired from the deck (still in EVENTS so saved games index correctly):
  // humans were silently auto-passed, which looked like a bug at the table.
  { name: 'Mercenary Captain', cat: 'interact', effect: 'Auction a Knight', retired: true,
    resolve: (g) => {

          bid = 0;
        }

        if (castle && !castle.unit) { castle.unit = { type: 'knight', owner: winner.id, moved: true, attacked: true }; log(g, `${winner.name} wins the Mercenary for ${highBid}g`, 'build'); }
      } else { log(g, 'Mercenary auction: all pass'); }
    }},
  { name: 'Royal Envoy', cat: 'interact', effect: 'No negotiation this round', flag: 'noNegotiate', retired: true },
  { name: 'Council of Nobles', cat: 'interact', effect: 'Point: most-pointed loses 3g', retired: true,
    resolve: (g) => {
      // AI points at highest fees; humans auto-point at highest fees for simplicity
      const alive = g.players.filter(p => !p.eliminated);
      if (alive.length < 3) { log(g, 'Council: too few players, no effect'); return; }
      const votes = {};
      alive.forEach(voter => {
        let target = null, maxF = -1;
        alive.forEach(p => { if (p.id !== voter.id) { const f = calcFees(g, p); if (f > maxF) { maxF = f; target = p; }}});
        if (target) votes[target.id] = (votes[target.id] || 0) + 1;
      });
      let max = 0, loser = null, tie = false;
      Object.entries(votes).forEach(([id, v]) => { if (v > max) { max = v; loser = id; tie = false; } else if (v === max) tie = true; });
      if (loser && !tie) {
        const p = g.players.find(pp => pp.id === +loser);
        p.gold = Math.max(0, p.gold - 3);
        log(g, `Council: ${p.name} most-pointed, −3g`, 'combat');
      } else { log(g, 'Council: tie, no effect'); }
    }}
];

// ============================================================================
// HEX MATH (axial coords)
// ============================================================================

const HEX_SIZE = 40;
const SQRT3 = Math.sqrt(3);

function hexToPixel(q, r) {
  return {
    x: HEX_SIZE * (SQRT3 * q + SQRT3/2 * r),
    y: HEX_SIZE * (3/2 * r)
  };
}
function hexKey(q, r) { return `${q},${r}`; }
const DIRS = [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
function neighbors(q, r) { return DIRS.map(([dq,dr]) => [q+dq, r+dr]); }
function hexDist(a, b) {
  return (Math.abs(a.q - b.q) + Math.abs(a.q + a.r - b.q - b.r) + Math.abs(a.r - b.r)) / 2;
}


// ============================================================================
// MAP GENERATION
// ============================================================================

// Walk the ring of hexes at exactly `radius` from the origin, in angular
// order. Used to drop home provinces at evenly spaced compass points.
function hexRing(radius) {
  const out = [];
  let q = DIRS[4][0] * radius, r = DIRS[4][1] * radius;
  for (let side = 0; side < 6; side++) {
    for (let step = 0; step < radius; step++) {
      out.push([q, r]);
      q += DIRS[side][0]; r += DIRS[side][1];
    }
  }
  return out;
}

// Where each house's home province is centred, in order going round the board.
// Homes must be EVENLY spaced or the seat that lands nearer the centre wins more, so the ring
// length (6 × radius) should divide by the player count. Five players cannot divide a small ring
// evenly and lean on the equal-land ridge in generateMap (seats 17–23% over 1,000 sims).
// HOME_REACH is how far a province spreads from its home (default 2). At five and six players the
// homes sit on a wide ring, and radius-2 provinces left 31 and 13 tiles of middle ground between
// them that read as an extra province; reach 3 on a tighter ring lets the provinces meet in the
// centre. Sims at 6p: first fight round 5 -> 3, 18 tiles each, seats 15–18%.
const HOME_RING = { 2: 2, 3: 3, 5: 4, 6: 3 };
const HOME_REACH = { 5: 3, 6: 3 };
function homeCenters(n) {
  // Four houses cannot sit evenly on any ring (ring 3 put them 5,4,5,4 apart and one seat won 32%).
  // This rhombus has every house exactly 4 from both neighbours and 6 from the one opposite, and
  // each corner is a mirror or half-turn of the others.
  if (n === 4) return [[-3, 1], [1, -3], [3, -1], [-1, 3]];
  // Five houses cannot sit evenly on any hex ring: ring 4 put two of them 4 apart and the rest 5,
  // and against the brutal AI the squeezed seat won 11%. Found by search: every house 5 from both
  // neighbours, four of them 4 from the centre and one 5, provinces within two tiles of each other
  // before the equal-land ridge evens them out.
  if (n === 5) return [[3, 1], [-2, 4], [-5, 2], [-1, -3], [4, -4]];
  const ring = hexRing(HOME_RING[n] || 4);
  return Array.from({ length: n }, (_, i) => ring[Math.round(i * ring.length / n) % ring.length]);
}

// Symmetric board: one HOME province per house (tract i+1 for player i), no contested middle.
// Homes sit evenly spaced on a ring around the board centre and their provinces touch, so every
// house borders its neighbours from the first turn. Each house places its castle inside its own
// province. The few hexes exactly equidistant from three or more homes stay neutral (tract 0).
//
// Why: the old map handed out numPlayers+2 provinces and let castles go
// anywhere. In 900 simulated games the house that placed first — and so
// grabbed the most isolated corner — won ~2× its share, and the seat that
// went last (it placed first) took 48–77% of all wins. A fair start is the
// single biggest competitive fix this game needed.
//
// Why no middle province: with one, houses sat eight tiles apart and raced the empty centre
// instead of each other. At two players 73% of games against the hardest AI ended without a
// single fight. Touching provinces put rivals four or five tiles apart at every player count.
function generateMap(numPlayers) {
  const centers = [[0, 0], ...homeCenters(numPlayers)];
  const R = Math.max(...centers.map(([q, r]) => hexDist({ q, r }, { q: 0, r: 0 })));

  const homePool   = { grass: 0.80, forest: 0.14, mountain: 0.03, lake: 0.03 };
  const centerPool = { grass: 0.52, forest: 0.24, mountain: 0.08, lake: 0.16 };

  // The board is every hex within reach of a home, plus everything inside the ring so the middle
  // has no hole. Each hex joins the nearest home.
  const candidates = {};
  const addCandidate = (q, r) => { if (!candidates[hexKey(q, r)]) candidates[hexKey(q, r)] = { q, r, tract: 0 }; };
  const reach = HOME_REACH[numPlayers] || 2;
  centers.forEach(([cq, cr], ti) => {
    if (ti === 0) return;
    for (let dq = -reach; dq <= reach; dq++) {
      for (let dr = Math.max(-reach, -dq - reach); dr <= Math.min(reach, -dq + reach); dr++) addCandidate(cq + dq, cr + dr);
    }
  });
  for (let q = -R; q <= R; q++) for (let r = -R; r <= R; r++) if (hexDist({ q, r }, { q: 0, r: 0 }) < R) addCandidate(q, r);
  Object.values(candidates).forEach(c => {
    const ds = centers.slice(1).map(([hq, hr]) => hexDist(c, { q: hq, r: hr }));
    const best = Math.min(...ds);
    const tied = ds.map((d, i) => d === best ? i + 1 : 0).filter(Boolean);
    if (tied.length === 1) { c.tract = tied[0]; return; }
    if (tied.length > 2) return;   // three or more homes equally near: neutral ground
    const [a, b] = tied;
    if (numPlayers === 2) {
      // Split by 180° rotation, so each house gets the mirror image of the other's half; giving
      // every tie to one side handed it a longer front line and cost it 5 points of win rate.
      c.tract = (c.q === 0 && c.r === 0) ? 0 : (c.q > 0 || (c.q === 0 && c.r > 0)) ? 1 : 2;
    } else {
      // Two homes equally near in steps: give the tile to the one nearer as the crow flies. That rule
      // looks the same from every direction, so mirrored layouts stay mirrored. The earlier rule
      // (first house going round wins the seam) was not mirror-symmetric, and on the four-player
      // diamond two opposite seats won 30% of games and the other two 20%.
      const px = (q, r) => [Math.sqrt(3) * (q + r / 2), 1.5 * r];
      const [cx, cy] = px(c.q, c.r);
      const e = t => { const [hx, hy] = px(...centers[t]); return (hx - cx) ** 2 + (hy - cy) ** 2; };
      const ea = e(a), eb = e(b);
      if (Math.abs(ea - eb) > 1e-6) c.tract = ea < eb ? a : b;
      // Still tied: on the rings (3, 5, 6 houses) the tile goes to the house that comes first going
      // round, which keeps every province a rotation of the others. The four-player diamond is also
      // mirrored, and no rule can hand a tile on the mirror line to one side, so it stays neutral.
      else if (numPlayers !== 4 && (b - a === 1 || (a === 1 && b === numPlayers))) c.tract = (b - a === 1) ? a : b;
    }
  });

  const hexes = [], hexMap = {};
  Object.values(candidates).forEach(({ q, r, tract }) => {
    const pool = tract === 0 ? centerPool : homePool;
    const roll = rand();
    let acc = 0, terrain = 'grass';
    for (const [t, w] of Object.entries(pool)) { acc += w; if (roll < acc) { terrain = t; break; } }
    const rivers = [];
    if (terrain === 'grass' && rand() < 0.12) rivers.push(Math.floor(rand() * 6));
    const hex = { q, r, terrain, rivers, tract, fief: null, unit: null, holding: null };
    hexes.push(hex);
    hexMap[hexKey(q, r)] = hex;
  });

  // Every home province centre is guaranteed open grass — a castle site that
  // can never be blocked by an unlucky terrain roll.
  centers.forEach(([cq, cr], ti) => {
    if (ti === 0) return;
    const h = hexMap[hexKey(cq, cr)];
    if (h) { h.terrain = 'grass'; h.rivers = []; }
  });

  // Equal land for every house. Provinces are radius-2 discs clipped by
  // their neighbours, so at 4 players the corner homes keep 18 hexes and the
  // mid homes 16 — and over 1,000 sims the corners won 30%/28% vs 21%/21%.
  // Handing the surplus to the contested centre did NOT fix it (the corner
  // still grabs it first); removing it did. So an oversized home's outermost
  // hexes (farthest from the board centre) become a mountain ridge at the
  // edge of the realm: impassable, unclaimable, and it looks like a border.
  // Counted on non-mountain hexes so random mountains are evened out too.
  const byTract = {};
  hexes.forEach(h => { (byTract[h.tract] = byTract[h.tract] || []).push(h); });
  const homeIds = Object.keys(byTract).map(Number).filter(t => t > 0);
  const usable = t => byTract[t].filter(h => h.terrain !== 'mountain');
  const target = Math.min(...homeIds.map(t => usable(t).length));
  homeIds.forEach(t => {
    const [cq, cr] = centers[t];
    const fromHome = h => hexDist(h, { q: cq, r: cr });
    const fromMid  = h => hexDist(h, { q: 0, r: 0 });
    const hs = usable(t).sort((a, b) => (fromMid(b) - fromMid(a)) || (fromHome(b) - fromHome(a)) || (a.q - b.q) || (a.r - b.r));
    for (let i = 0; i < hs.length - target; i++) { hs[i].terrain = 'mountain'; hs[i].rivers = []; }
  });

  // Nobody may be walled in. A board where a house cannot reach the others over passable land
  // is unplayable: its units can never claim ground, siege anything, or be sieged. Mountains and
  // lakes both block, and the ridge above can close the last gap by accident, so check after all
  // terrain is settled and carve the thinnest path if it is broken.
  const passable = h => !!h && h.terrain !== 'mountain' && h.terrain !== 'lake';
  const components = () => {
    const comp = new Map();
    let id = 0;
    for (const h of hexes) {
      const k0 = hexKey(h.q, h.r);
      if (!passable(h) || comp.has(k0)) continue;
      id++;
      const stack = [h];
      while (stack.length) {
        const c = stack.pop(), k = hexKey(c.q, c.r);
        if (comp.has(k)) continue;
        comp.set(k, id);
        for (const [nq, nr] of neighbors(c.q, c.r)) {
          const n = hexMap[hexKey(nq, nr)];
          if (passable(n) && !comp.has(hexKey(nq, nr))) stack.push(n);
        }
      }
    }
    return comp;
  };
  // Home centres are forced to grass above, so each one is always in some component.
  for (let attempt = 0; attempt < 40; attempt++) {
    const comp = components();
    const want = comp.get(hexKey(centers[1][0], centers[1][1]));
    const stranded = new Set();
    for (const h of hexes) { const k = hexKey(h.q, h.r); if (passable(h) && comp.get(k) !== want) stranded.add(k); }
    if (!stranded.size) break;
    // 0/1 BFS outward from the main landmass: stepping onto passable land is free, stepping onto
    // rock or water costs one carve, so the first stranded tile reached is the one that joins for
    // the fewest tiles changed. Carving the whole route in also connects any home behind it.
    const dist = new Map(), prev = new Map(), deque = [];
    for (const h of hexes) if (comp.get(hexKey(h.q, h.r)) === want) { dist.set(hexKey(h.q, h.r), 0); deque.push(h); }
    let goal = null;
    while (deque.length) {
      const c = deque.shift(), k = hexKey(c.q, c.r);
      if (stranded.has(k)) { goal = k; break; }
      for (const [nq, nr] of neighbors(c.q, c.r)) {
        const n = hexMap[hexKey(nq, nr)];
        if (!n) continue;
        const nk = hexKey(nq, nr), nd = dist.get(k) + (passable(n) ? 0 : 1);
        if (dist.has(nk) && dist.get(nk) <= nd) continue;
        dist.set(nk, nd); prev.set(nk, k);
        if (passable(n)) deque.unshift(n); else deque.push(n);
      }
    }
    if (!goal) break;
    let k = goal, carved = 0;
    while (k && prev.has(k)) {
      const h = hexMap[k];
      if (h && !passable(h)) { h.terrain = 'grass'; h.rivers = []; carved++; }
      k = prev.get(k);
    }
    if (!carved) break;   // already joined by this route; nothing left to open
  }

  return { hexes, hexMap, tractCenters: centers };
}

// ============================================================================
// SERIALIZE / HYDRATE
// ============================================================================

function serialize(g) {
  // Event objects are identity-refs into the EVENTS array — store indices.
  // indexOf is O(n) but n=19 and this runs once per action, not per frame.
  const evIdx = ev => ev ? EVENTS.indexOf(ev) : -1;

  return {
    version: (g.version || 0) + 1,  // bumped on every write; reader skips stale snapshots

    players: g.players.map(p => ({
      id: p.id, name: p.name, color: p.color, ai: p.ai,
      clientId: p.clientId || null,        // which browser controls this seat (null = AI or unclaimed)
      house: p.house.key,                  // ref → key
      homeTract: p.homeTract,
      gold: p.gold,
      eliminated: p.eliminated,
      castleLost: p.castleLost,
      capturedHolding: p.capturedHolding,
      unitBuildsThisRound: [...(p.unitBuildsThisRound || [])],
      rightOfPassage: [...p.rightOfPassage],  // Set → array
      _usedRoyalFavor: p._usedRoyalFavor || false,
    })),

    // Hexes are already plain objects. hexMap is a derived index — don't ship it.
    // Deep-copy the board. Handing out the live hexes means hydrate(serialize(g))
    // aliases the original, so anything written to the "copy" lands on the real game.
    hexes: g.hexes.map(h => ({ ...h, rivers: h.rivers ? h.rivers.slice() : h.rivers, unit: h.unit ? { ...h.unit } : null, holding: h.holding ? { ...h.holding } : null })),
    tractCenters: g.tractCenters || [],

    round: g.round,
    phase: g.phase,
    turn: g.turn,
    firstPlayer: g.firstPlayer,
    firstPlayerSeat: g.firstPlayerSeat,
    castlesPlaced: g.castlesPlaced,

    // Events: EVENTS[i] objects carry .resolve closures — store positions instead
    currentEvent: evIdx(g.currentEvent),
    eventDeck:    g.eventDeck.map(evIdx),
    eventDiscard: g.eventDiscard.map(evIdx),
    eventFlags:   JSON.parse(JSON.stringify(g.eventFlags)),
    eventAge:     g.eventAge || 0,

    componentsUsed: { ...g.componentsUsed },
    difficulty: g.difficulty,
    victory: g.victory ? { winner: g.victory.winner.id, cond: g.victory.cond, val: g.victory.val } : null,
    logEntries: g.logEntries.map(e => ({ ...e })),

    tutorialShown: [...g.tutorialShown],
    tutorialSkipped: g.tutorialSkipped,

    // Selection is deliberately NOT synced — it's per-client UI, and leaking
    // it tells opponents what you're about to do. Re-resolved locally after
    // hydrate (see applySnapshot).
  };
}

function hydrate(data) {
  const houseByKey = Object.fromEntries(HOUSES.map(h => [h.key, h]));
  const evAt = i => (i >= 0 && i < EVENTS.length) ? EVENTS[i] : null;

  // Rebuild the q,r → hex lookup
  const hexMap = {};
  for (const h of data.hexes) hexMap[hexKey(h.q, h.r)] = h;

  const g = {
    version: data.version,

    players: data.players.map(p => ({
      ...p,
      house: houseByKey[p.house],
      rightOfPassage: new Set(p.rightOfPassage),
    })),

    hexes: data.hexes,
    hexMap,
    tractCenters: data.tractCenters || [],

    round: data.round,
    phase: data.phase,
    turn: data.turn,
    firstPlayer: data.firstPlayer,
    firstPlayerSeat: data.firstPlayerSeat,
    castlesPlaced: data.castlesPlaced,

    currentEvent: evAt(data.currentEvent),
    eventDeck:    data.eventDeck.map(evAt).filter(Boolean),
    eventDiscard: data.eventDiscard.map(evAt).filter(Boolean),
    eventFlags:   data.eventFlags,
    eventAge:     data.eventAge || 0,

    componentsUsed: data.componentsUsed,
    difficulty: data.difficulty,
    victory: null,   // re-linked below once players exist
    logEntries: data.logEntries,

    tutorialShown: new Set(data.tutorialShown),
    tutorialSkipped: data.tutorialSkipped,

    // Per-client UI state — fresh on every hydrate. A remote action landing
    // mid-move-preview clears your preview, which is correct: the board changed.
    selected: null,
    mode: null,
    validMoves: null,
    validTargets: null,
    pendingAttackHex: null,
  };
  if (data.victory) g.victory = { winner: g.players[data.victory.winner], cond: data.victory.cond, val: data.victory.val };

  return g;
}
