  if (!game || game.phase === 'over') return;
  if (ui.sheet) { closeSheet(); return; }
  if (me().ai) return;
  if (ui.spotKey && ui.spotTap) spotHide();
  if (game.phase === 'setup-castle') {
    if (h && ui.lit.has(key(h.q, h.r))) { haptic('medium'); await run(() => E.placeCastle(game, h)); }
    else { if (h) pipAt(h); toast('Choose a lit tile inside your home province'); }
    return;
  }
  ui.actReason = null;
  if (ui.mode === 'build-outpost') {
    if (h && ui.lit.has(key(h.q, h.r))) { haptic('medium'); await run(() => E.buildHolding(game, h, 'outpost'), () => { ui.sel = key(h.q, h.r); ui.lit = new Map(); ui.mode = null; }); }

  }

    });
    return;

    if (ui.selMode !== 'holding' && h.unit && h.unit.owner === me().id && h.holding && h.holding.owner === me().id) { ui.selMode = 'holding'; ui.lit = new Map(); ui.hot = new Map(); haptic('selection'); renderAll(); return; }

  if (!r.ok) {
    ui.busy = false;
    if (r.why === 'supply') { haptic('warning'); openSheet('supply', { gold: r.gold, need: r.need }); }
    else if (r.why === 'ambiguous') { /* handled by caller */ }
    else if (r.why && r.why !== 'over') toast(noEmoji(r.why));

    return;
  }
  await playEffects(r.effects, false);

    const r = rectOf(); const p = { x: (ev.clientX - r.left) / r.z, y: (ev.clientY - r.top) / r.z };
    ptrs.set(ev.pointerId, p);
    if (ptrs.size === 2 && pinch) {
      const [a, b] = [...ptrs.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y); const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
      const ns = Math.max(view.base * 0.6, Math.min(view.base * 3, pinch.s * d / pinch.d));
      view.tx = cx - (pinch.cx - pinch.tx) * (ns / pinch.s); view.ty = cy - (pinch.cy - pinch.ty) * (ns / pinch.s); view.s = ns;
      clampView(); applyView();
    } else if (ptrs.size === 1 && drag) {
      const dx = p.x - drag.x, dy = p.y - drag.y;
      if (!moved && Math.hypot(dx, dy) > 8) moved = true;
      if (moved) { const now = performance.now(); const dt = Math.max(1, now - lastMove); vx = (p.x - drag.lx) / dt * 16; vy = (p.y - drag.ly) / dt * 16; drag.lx = p.x; drag.ly = p.y; lastMove = now; view.tx = drag.tx + dx; view.ty = drag.ty + dy; clampView(); applyView(); }
    }
  });
  const end = ev => {
    if (!ptrs.has(ev.pointerId)) return;
    const r = rectOf(); const p = { x: (ev.clientX - r.left) / r.z, y: (ev.clientY - r.top) / r.z };
    ptrs.delete(ev.pointerId);
    if (ptrs.size === 0) {
      if (!moved && drag) {
        const now = Date.now();
        if (now - lastTap < 320 && lastTapAt && Math.hypot(p.x - lastTapAt.x, p.y - lastTapAt.y) < 24) {
          lastTap = 0;
          const h = hexFromScreen(p.x, p.y);
          if (Math.abs(view.s / view.base - 1) < 0.05 && h) centreOn(h, view.base * 1.6); else fitHome();
          return;
        }
        lastTap = now; lastTapAt = p;
        onHexTap(hexFromScreen(p.x, p.y));
      } else if (moved && drag && performance.now() - lastMove < 80 && !RM()) {
        const step = () => { vx *= 0.92; vy *= 0.92; view.tx += vx; view.ty += vy; clampView(); applyView(); if (Math.abs(vx) + Math.abs(vy) > 0.3) raf = requestAnimationFrame(step); };
        raf = requestAnimationFrame(step);
      }
      drag = null; pinch = null;
    } else if (ptrs.size === 1) { const [q] = [...ptrs.values()]; drag = { x: q.x, y: q.y, tx: view.tx, ty: view.ty, lx: q.x, ly: q.y }; pinch = null; }
  };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  el.addEventListener('wheel', ev => {
    ev.preventDefault();
    const r = rectOf(); const cx = (ev.clientX - r.left) / r.z, cy = (ev.clientY - r.top) / r.z;
    zoomTo(view.s * Math.exp(-ev.deltaY * 0.002), cx, cy);
  }, { passive: false });
  el.addEventListener('dblclick', ev => ev.preventDefault());
})();

// ---------------------------------------------------------------- actions (event delegation)
document.addEventListener('click', async ev => {
  const btn = ev.target.closest('[data-act]'); if (!btn || btn.disabled) return;
  const act = btn.getAttribute('data-act'); const [verb, a1, a2] = act.split(':');
  if (btn.classList.contains('act') && btn.classList.contains('off')) { ui.actReason = actionReason(act) || 'Not available right now'; renderActionBar(); haptic('warning'); setTimeout(() => { if (ui.actReason) { ui.actReason = null; if (ui.screen === 'play') renderActionBar(); } }, 2200); return; }
  if (ui.spotKey && ui.spotTap && (btn.id === 'hud-end' || btn.id === 'hud-round' || btn.closest('.actionbar'))) spotHide();
  switch (verb) {
    case 'new': renderSetup(); showScreen('new'); break;
    case 'continue': resumeGame(); break;
    case 'howto': renderHowto(); showScreen('howto'); break;
    case 'houses': renderHouses(); showScreen('houses'); break;
    case 'title': showScreen('title'); break;
    case 'back': goBack(); break;
    case 'start': startGame(); break;
    case 'count': setup.count = +a1; renderSetup(); break;
    case 'diff': setup.diff = a1; renderSetup(); break;
    case 'seat': setup.seats[+a1] = a2 === 'ai'; if (!setup.seats.slice(0, setup.count).some(x => !x) && a2 === 'ai') { toast('At least one seat must be human'); setup.seats[+a1] = false; } renderSetup(); break;
    case 'end-turn': if (!ui.busy && isHumanTurn()) { haptic('light'); const e = $('hud-end'); e.classList.remove('stamp'); void e.offsetWidth; e.classList.add('stamp'); await run(() => E.endTurn(game)); } break;
    case 'supply-force': closeSheet(); await run(() => E.endTurn(game, { force: true })); break;
    case 'deselect': clearSel(); renderAll(); break;
    case 'buildopt': {
      const o = buildOptions()[+a1]; if (!o) break;
      if (!o.ok && o.move) { closeSheet(); haptic('selection'); selectHex(o.move); renderAll(); await nudgeToShowLit(); break; }
      if (!o.ok) { toast(o.why); haptic('warning'); break; }
      closeSheet();
      if (o.kind === 'unit') { haptic('medium'); await run(() => E.buildUnit(game, o.type, o.hex), () => { ui.sel = key(o.hex.q, o.hex.r); ui.selMode = 'holding'; ui.lit = new Map(); ui.hot = new Map(); }); }
      else if (o.kind === 'village') { haptic('medium'); await run(() => E.buildHolding(game, o.hex, 'village'), () => { ui.sel = key(o.hex.q, o.hex.r); ui.lit = new Map(); ui.hot = new Map(); }); }
      else { clearSel(); ui.mode = 'build-outpost'; for (const h of o.sites) ui.lit.set(key(h.q, h.r), true); haptic('selection'); renderAll(); await nudgeToShowLit(); }
      break; }
    case 'recentre': haptic('selection'); fitHome(); break;
    case 'recruit': { const h = hexAtKey(ui.sel); if (h) { haptic('medium'); await run(() => E.buildUnit(game, a1, h), () => { ui.sel = key(h.q, h.r); ui.lit = new Map(); ui.hot = new Map(); }); } break; }
    case 'build': { const h = hexAtKey(ui.sel); if (h) { haptic('medium'); await run(() => E.buildHolding(game, h, a1), () => { ui.sel = key(h.q, h.r); ui.lit = new Map(); ui.hot = new Map(); }); } break; }
    case 'ranged-on': { const h = hexAtKey(ui.sel); if (!h) break; ui.mode = 'ranged'; ui.lit = new Map(); ui.hot = new Map(); for (const t of E.rangedTargets(game, h)) { const k = key(t.hex.q, t.hex.r); ui.hot.set(k, [...(ui.hot.get(k) || []), t.type]); } haptic('selection'); renderAll(); await nudgeToShowLit(); break; }
    case 'ranged-off': { const h = hexAtKey(ui.sel); selectHex(h); renderAll(); break; }
    case 'ranged-unit': case 'ranged-holding': { const p = ui.rangedPending; ui.rangedPending = null; if (p) { haptic('medium'); await run(() => E.ranged(game, p.from, p.to, verb === 'ranged-unit' ? 'unit' : 'holding'), afterShot(p.from)); } break; }
    case 'event-show': closeSheet(); showEvent(null); break;
    case 'event-close': closeEvent(); break;
    case 'handoff-ok': { $('v-handoff').hidden = true; const r = ui.handoffResolve; ui.handoffResolve = null; if (r) r(); break; }
    case 'victory-map': $('v-victory').hidden = true; $('board-wrap').classList.remove('grey'); renderAll(); break;
    case 'victory-show': $('v-victory').hidden = false; break;
    case 'victory-title': $('v-victory').hidden = true; $('board-wrap').classList.remove('grey'); game = null; showScreen('title'); break;
    case 'victory-new': $('v-victory').hidden = true; $('board-wrap').classList.remove('grey'); game = null; renderSetup(); showScreen('new'); break;
    case 'sheet': if (ui.busy && a1 !== 'board' && a1 !== 'income') break; if (a1 === 'build' && !(isHumanTurn() && game.phase === 'act')) break; if (ui.spotKey && ui.spotTap) spotHide(); openSheet(a1); break;
    case 'sheet-close': closeSheet(); if (ui.screen === 'play') renderAll(); break;
    case 'menu': if (!game) break; openSheet('menu'); break;
    case 'menu-howto': closeSheet(); renderHowto(); showScreen('howto'); break;
    case 'menu-houses': closeSheet(); renderHouses(); showScreen('houses'); break;
    case 'menu-quit': { closeSheet(); save(); spotHide(); $('v-handoff').hidden = true; $('v-event').hidden = true; const hr = ui.handoffResolve, er = ui.eventResolve; ui.handoffResolve = null; ui.eventResolve = null; showScreen('title'); if (hr) hr(); if (er) er(); break; }
    case 'set': { if (a1 === 'text') settings.text = a2; else settings[a1] = a2 === '1'; applySettings(); renderSheet(); if (a1 === 'text') requestAnimationFrame(() => { renderHud(); }); break; }
    case 'tip-ok': closeTip(false); renderAll(); break;
    case 'tip-skip': closeTip(true); renderAll(); break;
  }
});
$('v-event').addEventListener('click', ev => { if (ev.target === $('v-event')) closeEvent(); });

// ---------------------------------------------------------------- static pages
function lessonPic(inner) { return `<div class="pic"><svg viewBox="0 0 100 100" aria-hidden="true">${inner}</svg></div>`; }
function renderHowto() {
  const W = RULES.winFor(4);   // the standard targets; two-player games note their own
  const hexPic = (tid, extra = '') => `<use href="#${tid}" x="0" y="0" width="100" height="100"/>${extra}`;
  const L = [
    ['Three roads to the crown', lessonPic(hexPic('hex-grass-b2', `<use href="#hold-castle" width="100" height="100" color="var(--h-crimson)"/>`)),
      `Reach <b>${W.pop} population</b> (villages and castles), <b>${W.income} income</b> a turn (fiefs plus population; ${RULES.winFor(2).income} in a two-player game), or <b>Conquest</b>: capture any enemy castle and the game ends at once. Population and income are checked at the end of each round. If two houses cross a line in the same round, the one further past it wins.`],
    ['Move and claim', lessonPic(hexPic('hex-grass-b1', `<use href="#hex-lit" width="100" height="100"/><use href="#unit-halo" x="14" y="14" width="72" height="72"/><use href="#unit-knight" x="20" y="20" width="60" height="60" color="var(--h-azure)"/>`)),
      `Tap a unit and every tile it can reach lights up gold. Tap one to go. <b>Every tile you step on becomes your fief.</b> Spearmen and bowmen move 1, knights move 2 and claim both tiles. Forests and rivers end a move, though <b>Forced March</b> lets you ride straight through trees. Mountains and lakes block, except lakes in <b>Winter</b>.`],
    ['Supply lines', lessonPic(hexPic('hex-grass-b3', `<use href="#ic-supply" x="30" y="26" width="40" height="40" color="#241A12"/><use href="#ic-skull" x="58" y="58" width="30" height="30" color="#B23A2E"/>`)),
      `Each unit costs <b>1 gold per tile</b> back to your nearest holding, paid when you end your turn, and supply only traces <b>through your own fiefs</b>. A unit with no path home <b>deserts</b>. Outposts make supply cheaper but do not keep units alive. The gold chip shows the bill as a red number.`],
    ['Build', lessonPic(hexPic('hex-grass-b2', `<use href="#hold-village" width="100" height="100" color="var(--h-verdant)"/>`)),
      `Tap a holding to recruit, one unit per holding per round. With a unit on your fief, tap the tile to build an <b>outpost</b>. Tap an outpost to upgrade it to a <b>village</b>: +3 population and a supply anchor.`],
    ['Fight', lessonPic(`<use href="#unit-halo" x="4" y="24" width="44" height="44"/><use href="#unit-spearman" x="8" y="28" width="36" height="36" color="var(--h-crimson)"/><use href="#unit-halo" x="52" y="24" width="44" height="44"/><use href="#unit-knight" x="56" y="28" width="36" height="36" color="var(--h-azure)"/>`),
      `Spearman beats knight, knight beats bowman, bowman beats spearman. A bowman can also <b>shoot</b> an adjacent enemy or its walls instead of moving.`],
    ['Siege and capture', lessonPic(hexPic('hex-grass-b1', `<use href="#hold-castle" width="100" height="100" color="var(--h-gilt)"/><use href="#wall-crack" width="100" height="100"/><use href="#siege-fire" x="55" y="10" width="40" height="40"/>`)),
      `Stand on an enemy holding, or next to it, and its walls lose 1 at the end of the round for every enemy touching it. Walls heal only when no enemy is on or beside them. Walk onto a holding with 0 walls and it is <b>yours at once</b>. A castle has 5 walls: the arc around each crest turns amber, then red, as a house's keep weakens.`],
    ['Events', lessonPic(`<circle cx="50" cy="50" r="40" fill="#241A12"/><use href="#ic-ev-tempo" x="28" y="28" width="44" height="44" color="#F1DA96"/>`),
      `From round 2 a card turns over each round: seasons that change movement, reckonings that punish the strong, fortunes that help the weak, prosperity that makes things cheap. Tap the round chip any time to read it again.`],
  ];
  const legend = [['ic-endturn', 'End turn'], ['ic-act-shoot', 'Shoot'], ['ic-act-info', 'Details'], ['ic-act-cancel', 'Deselect'], ['ic-act-outpost', 'Build outpost'], ['ic-act-upgrade', 'Upgrade to village'], ['ic-act-walls', 'Shoot the walls'], ['ic-recentre', 'Back to your castle'], ['ic-gold', 'Gold'], ['ic-supply', 'Supply'], ['ic-skull', 'Desertion'], ['ic-ev-tempo', 'Season'], ['ic-ev-brake', 'Reckoning'], ['ic-ev-catchup', 'Fortune'], ['ic-ev-accel', 'Prosperity']];
  $('howto-body').innerHTML = `<div class="reader">${L.map(([t, pic, body]) => `<div class="lesson">${pic}<div><h3>${t}</h3><p>${body}</p></div></div>`).join('')}
    <div class="label" style="margin-top:6px">Icons</div><div class="legend">${legend.map(([id, l]) => `<div>${ico(id, '')}<span>${l}</span></div>`).join('')}</div></div>`;
}
function renderHouses() {
  $('houses-body').innerHTML = `<div class="reader">
    <p class="hint" style="text-align:center;margin:0 0 6px">One of these six houses is dealt to each seat at random when a game begins.</p>
    ${(() => {
      const held = {}; if (game && game.players) for (const q of game.players) held[q.house.key] = q;
      const you = game && game.players ? game.players.find(q => !q.ai) : null;
      const rows = RULES.HOUSES.slice().sort((a, b) => (held[b.key] ? 1 : 0) - (held[a.key] ? 1 : 0) || ((held[a.key] ? held[a.key].id : 0) - (held[b.key] ? held[b.key].id : 0)));
      let out = '', shownIdle = false;
      for (const h of rows) {
        const q = held[h.key];
        if (!q && !shownIdle && Object.keys(held).length) { shownIdle = true; out += `<div class="label" style="margin-top:6px">Not in this game</div>`; }
        const mine = you && q && q.id === you.id;
        const seat = q
          ? `<div class="seat-of" style="color:${col(q.id)}"><svg aria-label="${esc(dn(q))} seat"><use href="#${crestOf(q.id)}"/></svg>${mine ? '<span class="tagme">you</span>' : ''}</div>`
          : `<div class="seat-of empty" aria-hidden="true"></div>`;
        out += `<div class="house-row${q ? ' held' : ' idle'}">${seat}<div class="crest">${ico(HOUSE_ICON[h.key] || 'ic-houses', '')}</div><div><div class="nm">${esc(h.name)}</div><div class="pk">${esc(h.power)}</div></div></div>`;
      }
      return out;
    })()}
  </div>`;
}

// ---------------------------------------------------------------- boot
function applyInsets() {
  if (N && N.insets) { const f = $('frame'); const i = N.insets; f.style.setProperty('--sal', (i.left || 0) + 'px'); f.style.setProperty('--sar', (i.right || 0) + 'px'); f.style.setProperty('--sab', (i.bottom || 0) + 'px'); f.style.setProperty('--sat', (i.top || 0) + 'px'); }
}
window.addEventListener('resize', () => { if (ui.screen === 'play' && vis) { baseScale(); clampView(); applyView(); fitCrests(); if (ui.spotKey) checkTips(); } });
document.addEventListener('visibilitychange', () => { if (document.hidden && game) save(); });
window.addEventListener('error', ev => { console.error('[nobles]', ev.message); });
window.addEventListener('unhandledrejection', ev => { console.error('[nobles] unhandled', ev.reason && (ev.reason.stack || ev.reason)); });
applyInsets();
// Device emulation for screenshots/tests: ?w=852&h=393&sa=1 sizes the frame; &z=0.6 scales it; &ts=s|l text size
(function emulate() {
  const q = new URLSearchParams(location.search); const w = +q.get('w'), h = +q.get('h');
  if (!w || !h) return;
  const f = $('frame'); f.classList.add('emu');
  Object.assign(f.style, { width: w + 'px', height: h + 'px', left: Math.max(0, (innerWidth - w) / 2) + 'px', top: Math.max(0, (innerHeight - h) / 2) + 'px' });
  if (q.get('sa')) { const sa = w >= 900 ? '62px' : '59px'; f.style.setProperty('--sal', sa); f.style.setProperty('--sar', sa); f.style.setProperty('--sab', '21px'); }
  const z = +q.get('z'); if (z && z !== 1) { f.style.transform = `scale(${z})`; f.style.transformOrigin = 'top left'; f.style.left = '0px'; f.style.top = '0px'; }
})();
loadSettings();
$('diff-range').addEventListener('input', ev => { setup.diff = DIFFS[+ev.target.value][0]; haptic('selection'); renderSetup(); });
renderSetup();
loadSaved();
showScreen('title');
try { N && N.send && N.send({ type: 'ready' }); } catch (e) {}
window.Nobles = { get game() { return game; }, ui, view, settings, E, run, snapshot: () => vis, hexFromScreen, onHexTap, renderAll, toScreen, openSheet, closeSheet, fitHome, get saved() { return saved; } };
})();

</script>
